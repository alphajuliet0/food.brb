:root { --ink:#0A0A0A; --ink2:#595959; --ink3:#999999; --hair:#D9D9D9; --teal:#E5321B; --red:#E5321B; --sand:#EFEFEF; --page:#F7F7F7; --white:#FFFFFF; }
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--ink); font-family:Inter,-apple-system,'Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:1.6; }
.wrap { max-width:640px; margin:0 auto; padding:18px 16px 90px; }
h1 { font-family:Inter,-apple-system,'Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:34px; letter-spacing:-0.055em; line-height:1.08; margin:8px 0 2px; }
h1.brand { display:flex; align-items:center; min-height:38px; margin:2px 0 0; font-size:25px; line-height:1; letter-spacing:0; }
.food-name { display:inline-flex; align-items:baseline; gap:.08em; white-space:nowrap; }
.food-prefix { font-family:Inter,-apple-system,sans-serif; font-weight:600; letter-spacing:-.045em; }
.food-brb { display:inline-flex; align-items:center; margin-left:.03em; padding:0; font-family:Nasalization,monospace; font-weight:400; letter-spacing:.02em; border:0; }
.food-brb .red { color:var(--red); }
.tag { color:var(--ink2); font-size:14px; margin:0 0 8px; }
.intro { color:var(--ink); font-size:15px; line-height:24px; margin:0 0 14px; }
nav.tabs { display:flex; gap:16px; border-bottom:1px solid var(--hair); overflow-x:auto; position:sticky; top:0; background:var(--page); z-index:5; -webkit-overflow-scrolling:touch; }
nav.tabs button { flex:0 0 auto; border:none; background:none; padding:12px 2px; min-height:44px; font-size:15px; color:var(--ink2); cursor:pointer; font-family:inherit; }
nav.tabs button.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--ink); font-weight:600; }
section.tab { display:none; }
section.tab.on { display:block; }
h2 { font-family:Inter,-apple-system,sans-serif; font-weight:500; font-size:22px; letter-spacing:-0.035em; line-height:1.15; margin:28px 0 6px; }
h3 { font-size:15px; margin:0; }
.slothead { margin:12px 0 4px; }
.note { color:var(--ink2); font-size:14px; line-height:21px; margin:8px 0; }
.dim { color:var(--ink2); font-size:13px; }
.tiny { font-size:12px; color:var(--ink3); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.stat { border:1px solid var(--hair); border-radius:8px; padding:10px 12px; }
.stat .l { color:var(--ink2); font-size:13px; }
.stat .v { font-size:17px; font-weight:600; margin:2px 0 6px; }
.bar { height:6px; border-radius:3px; background:var(--sand); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--teal); border-radius:3px; }
.btn { display:inline-flex; font-weight:650; align-items:center; justify-content:center; min-height:44px; padding:8px 16px; border-radius:2px; border:1px solid var(--hair); background:#fff; color:var(--ink); font-size:15px; cursor:pointer; font-family:inherit; text-decoration:none; }
.btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
.btn.danger { color:var(--red); border-color:#f5aaae; }
.btn:disabled { color:#c0bebf; cursor:default; }
.qr { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
.field { margin:10px 0; }
.label { display:block; color:var(--ink2); font-size:13px; margin-bottom:4px; }
.input { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--hair); border-radius:6px; font-size:16px; color:var(--ink); background:#fff; font-family:inherit; }
textarea.input { min-height:72px; resize:vertical; }
.mini { width:84px; flex:0 0 auto; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
.chip { min-height:44px; padding:8px 14px; border-radius:22px; border:1px solid var(--hair); background:#fff; color:var(--ink2); font-size:14px; cursor:pointer; font-family:inherit; }
.chip.on { border-color:var(--teal); color:var(--ink); background:var(--sand); }
.list { display:flex; flex-direction:column; margin:8px 0; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--hair); }
.rowc { flex-direction:column; align-items:flex-start; gap:2px; }
.rowbtn { display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; padding:10px 6px; border:none; border-bottom:1px solid var(--hair); background:none; font-size:15px; color:var(--ink); cursor:pointer; min-height:44px; font-family:inherit; }
.del { border:none; background:none; color:var(--red); font-size:13px; cursor:pointer; padding:8px 4px; min-height:44px; font-family:inherit; }

    if(dd.bedTime){ bedLogs++; if(dd.bedTime>'22:15') lateBeds++; }

  if(bedLogs>=4 && lateBeds>=3)

    reader.onload=()=>{ try{ const s=JSON.parse(String(reader.result));
        if(!s||s.v!==1||!s.profile){ toast('That file is not a food.brb backup.'); return; }
        state=s; save(); TAB_RENDER.data(); toast('Backup restored.'); }catch(err){ toast('Could not read that file.'); } };
    reader.readAsText(file); e.target.value='';
  };
  q('#d-clear').onclick=()=>{
    if(q('#d-clear').dataset.arm==='1'){ localStorage.removeItem(KEY); location.reload(); }
    else { q('#d-clear').dataset.arm='1'; q('#d-clear').textContent='Tap again to erase everything'; }
  };
  q('#d-setup').onclick=()=>{ showSetup(); };
};
/* ---------- first-run setup ---------- */
function calcAge(dob){
  if(!dob) return null;
  const d=new Date(dob+'T12:00:00'); if(isNaN(d)) return null;
  const now=new Date(); let a=now.getFullYear()-d.getFullYear();
  const before=now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate());
  if(before)a--; return a>=0&&a<130?a:null;
}
function parseHeight(value){
  const raw=(value||'').trim().toLowerCase().replace(/\s+/g,''); if(!raw)return null;
  let cm=null,m;
  if((m=raw.match(/^(\d+(?:\.\d+)?)cm$/))) cm=parseFloat(m[1]);
  else if((m=raw.match(/^(\d+(?:\.\d+)?)m$/))) cm=parseFloat(m[1])*100;
  else if((m=raw.match(/^(\d+)(?:'|ft)(\d+(?:\.\d+)?)?(?:"|in)?$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]||0))*2.54;
  else if((m=raw.match(/^(\d+)[: ](\d+(?:\.\d+)?)$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]))*2.54;
  else if(/^\d+(?:\.\d+)?$/.test(raw)) cm=parseFloat(raw); // unlabelled number means cm
  return cm>=90&&cm<=250?Math.round(cm*10)/10:null;
}
function displayHeight(cm){ if(cm==null)return ''; return Math.round(cm)+'cm'; }
function showSetup(){
  const el=document.getElementById('setup');
  const box=el.querySelector('.inner');
  const p=state.profile;
  box.innerHTML=`
  <h1 class="brand" aria-label="food.brb"><span class="food-name"><span class="food-prefix">food.</span><span class="food-brb"><span>b</span><span class="red">r</span><span>b</span></span></span></h1>
  <p class="tag">Your food, recovery and progress. Clear at a glance.</p>
  <h2>Begin your practice</h2>
  <p class="note">food.brb keeps everything on this device only. Nothing you enter here is sent anywhere. Set your baseline once; you can change it later in the Data tab.</p>
  <div class="grid2">
    <div class="field"><label class="label">Date of birth</label><input class="input" type="date" id="s-dob" max="${todayKey()}" value="${p.dob||''}"><p class="tiny" id="s-age-readout">${p.dob&&calcAge(p.dob)!=null?'Age '+calcAge(p.dob):'Your age is worked out automatically.'}</p></div>
    <div class="field"><label class="label">Height</label><input class="input" id="s-height" placeholder="e.g. 178cm or 5'10&quot;" value="${displayHeight(p.heightCm)}"><p class="tiny">Metric or imperial. Stored as centimetres.</p></div>
  </div>
  <div class="grid2">
    <div class="field"><label class="label">Current weight (kg)</label><input class="input" inputmode="decimal" id="s-wt" value="${p.startWeight==null?'':p.startWeight}"></div>
    <div class="field"><label class="label">Current waist (inches)</label><input class="input" inputmode="decimal" id="s-waist" value="${p.startWaist==null?'':p.startWaist}"></div>
  </div>
  <div class="field"><label class="label">Goal weight (kg)</label><input class="input" inputmode="decimal" id="s-goal" value="${p.goalWeight==null?'':p.goalWeight}"></div>
  <div class="qr"><button class="btn" id="s-suggest">Suggest my daily targets</button></div>
  <div class="grid2">
    <div class="field"><label class="label">Calories (kcal)</label><input class="input" inputmode="numeric" id="s-kcal" value="${p.kcalTarget}"></div>
    <div class="field"><label class="label">Protein (g)</label><input class="input" inputmode="numeric" id="s-prot" value="${p.proteinTarget}"></div>
    <div class="field"><label class="label">Water (glasses)</label><input class="input" inputmode="numeric" id="s-water" value="${p.waterTarget}"></div>
    <div class="field"><label class="label">Steps</label><input class="input" inputmode="numeric" id="s-steps" value="${p.stepsTarget}"></div>
  </div>
  <label class="check"><input type="checkbox" id="s-bp"${p.bpSafe?' checked':''}><span>I lift with controlled blood pressure. Show the BP-safe lifting and breathwork rules.</span></label>
  <div class="qr" style="margin-top:16px"><button class="btn primary" id="s-save">Begin</button><button class="btn" id="s-skip">Set up later</button></div>`;
  el.classList.add('open');
  const q=s=>box.querySelector(s);
  q('#s-dob').oninput=()=>{ const a=calcAge(q('#s-dob').value); q('#s-age-readout').textContent=a==null?'Enter a valid date of birth.':'Age '+a; };
  q('#s-suggest').onclick=()=>{
    const age=calcAge(q('#s-dob').value), cm=parseHeight(q('#s-height').value), kg=parseFloat(q('#s-wt').value);
    if(age==null||cm==null||!kg||isNaN(kg)){ toast('Enter a valid date of birth, height and weight first.'); return; }
    const bmr=10*kg+6.25*cm-5*age+5;
    q('#s-kcal').value=Math.max(1200,Math.round((bmr*1.5-400)/50)*50);
    q('#s-prot').value=Math.round(kg*1.8);
  };
  q('#s-save').onclick=()=>{
    const dob=q('#s-dob').value, age=calcAge(dob), cm=parseHeight(q('#s-height').value);
    const wt=parseFloat(q('#s-wt').value), waist=parseFloat(q('#s-waist').value), goal=parseFloat(q('#s-goal').value);
    if(age==null){ toast('Add a valid date of birth.'); return; }
    if(cm==null){ toast('Add height as centimetres or feet and inches, for example 178cm or 5\'10".'); return; }
    if(isNaN(wt)||isNaN(goal)){ toast('Add your current and goal weight to begin.'); return; }
    p.dob=dob; p.age=age; p.heightCm=cm;
    p.startWeight=wt; p.startWaist=isNaN(waist)?null:waist; p.goalWeight=goal;
    p.startDate=todayKey(); p.bpSafe=q('#s-bp').checked;
    const k=parseInt(q('#s-kcal').value,10), pr=parseInt(q('#s-prot').value,10), w=parseInt(q('#s-water').value,10), st=parseInt(q('#s-steps').value,10);
    if(!isNaN(k)&&k>0)p.kcalTarget=k; if(!isNaN(pr)&&pr>0)p.proteinTarget=pr; if(!isNaN(w)&&w>0)p.waterTarget=w; if(!isNaN(st)&&st>0)p.stepsTarget=st;
    if(!state.weights.length) state.weights=[{date:p.startDate,kg:wt}];
    if(p.startWaist!=null&&!state.waists.length) state.waists=[{date:p.startDate,inches:p.startWaist}];
    p.setupDone=true; save(); el.classList.remove('open'); TAB_RENDER.today(); window.scrollTo(0,0);
  };
  q('#s-skip').onclick=()=>{ el.classList.remove('open'); };
}
/* ---------- boot ---------- */
TAB_RENDER.today();
if(!state.profile.setupDone) showSetup();
</script>
<script>
if ('serviceWorker' in navigator) {
  // If a new service worker takes control while this page is open, reload once
  // so the new app version is shown. Skipped on first-ever install (nothing
  // controlled this page before) so first use never double-loads.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', function(){
    // updateViaCache:'none' makes update checks bypass the HTTP cache, so a new
    // sw.js is seen within minutes of a deploy instead of after cache expiry.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      reg.update().catch(function(){});
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) reg.update().catch(function(){}); });
    }).catch(function(){});
  });
}
</script>
</body>
