name: Materialize patch bundle
on:
  push:
    paths:
      - 'sadhana-patches/sadhana-v29-patches.zip.b64'
      - '.github/workflows/materialize-patch-bundle.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundle
        run: base64 -d sadhana-patches/sadhana-v29-patches.zip.b64 > sadhana-patches/sadhana-v29-patches.zip
      - name: Commit bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sadhana-patches/sadhana-v29-patches.zip
          git diff --cached --quiet || git commit -m "Materialize Sadhana v29 patch bundle"
          git push
