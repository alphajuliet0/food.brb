<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cap">
<meta name="theme-color" content="#131114">
<title>form.brb</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --kcal:#E5321B; --kcal-hi:#ff725f; --protein:#6f7fbf; --protein-hi:#aab6ff; --fibre:#d9a441; --fibre-hi:#ffd06b; --steps:#85818a;
  --green:#3f9d6b; --amber:#d9a441; --grey:#5c5860;
  --page:#131114; --surface:#1d1a1e; --surface2:#262228; --ink:#f2eef2; --dim:#9a939e; --hair:#332e35;
}
[data-theme=light]{
  --page:#f4f1f5; --surface:#ffffff; --surface2:#efeaf1; --ink:#221e24; --dim:#6f6873; --hair:#e2dce4;
  --steps:#6f6873;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:110px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.brand{display:flex;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.brand svg{height:14px;width:auto;margin-left:1px;transform:translateY(1px)}
.topbtns{display:flex;gap:8px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--dim)}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.dateline{padding:6px 20px 0;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.dateline strong{color:var(--ink);font-weight:600}
.titlerow{display:flex;align-items:center;gap:10px;padding:2px 20px 10px}
h1.today{font-size:25px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navchev{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface2);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center}
.navchev:disabled{opacity:.3}
.backchip{flex:0 0 auto;background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--protein-hi);letter-spacing:.4px}
[data-theme=light] .backchip{color:var(--protein)}
.weekstrip{display:flex;justify-content:space-between;padding:2px 20px 14px}
.daycol{display:flex;flex-direction:column;align-items:center;gap:6px;width:34px;border-radius:12px;padding:4px 0}
.daycol .dow{font-size:11px;color:var(--dim);font-weight:600}
.daycol.sel{background:var(--surface2)}
.daycol.sel .dow{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,#3a353c)}
.dot.hollow{background:transparent;border:1.5px solid var(--grey);width:6px;height:6px}
.hero{margin:0 16px;background:var(--surface);border-radius:22px;padding:20px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.herorow{display:flex;align-items:center;gap:20px}
.ringwrap{position:relative;width:138px;height:138px;flex:0 0 auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringtrack{fill:none;stroke:var(--surface2);stroke-width:7}
.ringarc{fill:none;stroke:var(--kcal);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringarc.bank{stroke:var(--protein);stroke-width:4;opacity:.9}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcenter .big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ringcenter .big.over{color:var(--kcal)}
.ringcenter .lbl{font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-top:4px}
.ringcenter .bankin{font-size:11px;color:var(--protein);margin-top:6px;font-weight:600}
.stack{width:148px;height:148px;position:relative;flex:0 0 auto}
.stack .aring{position:absolute;border-radius:50%;background:conic-gradient(from -90deg,var(--hi),var(--c) calc(var(--fill)*1%),var(--surface2) 0);cursor:pointer;transition:transform .15s}
.stack .aring.sel{transform:scale(1.045)}
.aring.cal{inset:0;--c:var(--kcal);--hi:var(--kcal-hi)}
.aring.pro{inset:13px;--c:var(--protein);--hi:var(--protein-hi)}
.aring.fib{inset:26px;--c:var(--fibre);--hi:var(--fibre-hi)}
.aring.stp{inset:39px;--c:#45424b;--hi:var(--steps)}
.stack .score{position:absolute;inset:52px;border-radius:50%;background:var(--surface)}
.stack .scenter{position:absolute;inset:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scenter .big{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1}
.scenter .big.over{color:var(--kcal)}
.scenter .lbl{font-size:9px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lline{padding:6px 10px;border-left:3px solid var(--c);background:var(--surface2);border-radius:0 10px 10px 0;cursor:pointer}
.lline b{display:block;font-size:13px}
.lline span{color:var(--dim);font-size:11px}
.actcard{margin:16px 16px 0;background:var(--surface);border-radius:18px;padding:16px 16px 18px}
.actcard h2{margin:0 0 10px;font-size:15px}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--surface2);border-radius:12px;padding:9px 10px}
.act .k{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.act .n{font-size:15px;font-weight:700;margin-top:3px}
.sparkwrap{padding-bottom:18px;margin-top:14px}
.spark{display:flex;align-items:flex-end;gap:6px;height:56px}
.spark i{flex:1;background:var(--surface2);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.spark i.today{background:linear-gradient(var(--kcal-hi),var(--kcal))}
.spark b{position:absolute;top:calc(100% + 4px);left:0;right:0;text-align:center;font-size:9px;color:var(--dim);font-weight:600}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block;vertical-align:baseline}
.syncdot.ok{background:var(--green)}.syncdot.busy{background:var(--amber)}.syncdot.err{background:var(--kcal)}
.yhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.yava{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#E5321B,#961d10);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface2)}
.yrow .yl{font-size:13px;color:var(--dim)}
.yrow .yv{font-size:13px;font-weight:600;text-align:right}
.ynote{font-size:11px;color:var(--dim);margin-top:12px;line-height:1.5}
button.avatar{cursor:pointer;border:0;font:inherit}

.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px}
.mrow .mtop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px}
.mrow .mname{color:var(--dim);font-weight:600}
.mrow .mval{font-weight:700}
.mrow .mval .goal{color:var(--dim);font-weight:500;font-size:12px}
.mrow .mval.over{color:var(--kcal)}
.mbar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bankhair{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bankhair i{display:block;height:100%;background:var(--protein);border-radius:2px}
.bankhairlbl{font-size:10px;color:var(--dim);margin-top:4px;text-align:right}
.bankrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:13px}
.bankrow .bl{color:var(--dim);font-weight:600}
.bankrow .bv{font-weight:700}
.bankrow .bv strong{color:var(--protein)}
.mealshead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 8px}
.mealshead h2{font-size:17px;font-weight:800}
.mealshead span{font-size:12px;color:var(--dim)}
.meals{margin:0 16px;display:flex;flex-direction:column;gap:10px}
.mealcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.mealcard .thumb{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.mealcard .minfo{flex:1;min-width:0}
.mealcard .mname2{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mealcard .mmacros{font-size:12px;color:var(--dim);margin-top:2px}
.mealcard .mkcal{font-weight:800;font-size:15px;white-space:nowrap}
.mealcard .mkcal span{font-size:11px;color:var(--dim);font-weight:500}
.quickchips{display:flex;gap:8px;padding:16px 20px 4px}
.qchip{background:var(--surface2);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
.emptylog{padding:26px 20px;text-align:center;color:var(--dim);font-size:13px}
.logbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--page) 28%)}
.logbarinner{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 10px 34px rgba(0,0,0,.3)}
.logbarinner input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:15px}
.logbarinner input::placeholder{color:var(--dim)}
.roundbtn{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim);flex:0 0 auto}
.roundbtn.primary{background:var(--kcal);color:#fff;font-size:20px;font-weight:600}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface2);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.mealhead{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;background:var(--page);padding:12px 4px 6px;font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim)}
.mealhead span{font-weight:600;letter-spacing:0;text-transform:none}
.mealwrap{position:relative;border-radius:18px;overflow:hidden}
.swipebg{position:absolute;inset:0;display:flex;align-items:center;font-size:12px;font-weight:700;padding:0 18px;border-radius:18px}
.swipebg.right{background:var(--kcal);color:#fff;justify-content:flex-start}
.swipebg.left{background:var(--protein);color:#fff;justify-content:flex-end}
.mealcard{position:relative;transition:transform .18s ease;touch-action:pan-y}
.copybtn{display:none;width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--dim);font-size:14px;align-items:center;justify-content:center;flex:0 0 auto}
@media(hover:hover){.mealcard:hover .copybtn{display:flex}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:84vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.fld input{width:100%;background:var(--surface2);border:0;border-radius:12px;padding:11px 14px;font-size:15px;color:var(--ink);outline:0}
.fld input:focus{box-shadow:0 0 0 2px var(--protein)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 .fld{margin-bottom:0}
.mchiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mchip{background:var(--surface2);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--dim)}
.mchip.sel{background:var(--kcal);color:#fff}
.sheetbtn{display:block;width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:700;text-align:center;margin-top:10px}
.sheetbtn.primary{background:var(--kcal);color:#fff}
.sheetbtn.ghost{background:var(--surface2);color:var(--dim)}
.sheetbtn.danger{background:transparent;color:var(--kcal)}
.sheetbtn.danger.arm{background:var(--kcal);color:#fff}
.dayrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--hair)}
.dayrow span{color:var(--dim);font-size:12px;font-weight:500}
.scanov{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.scanov.on{display:flex}
.scanhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;color:#fff}
.scanhead b{font-size:16px}
.scanhead button{color:#fff;font-size:14px;background:rgba(255,255,255,.15);border-radius:999px;padding:8px 16px}
.scanbox{flex:1;position:relative;overflow:hidden}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox canvas{display:none}
.scanmsg{padding:16px 20px calc(20px + env(safe-area-inset-bottom));color:#ccc;font-size:13px;text-align:center;background:#000}
.scanman{display:flex;gap:8px;padding:0 20px 14px;background:#000}
.scanman input{flex:1;background:#222;border:0;border-radius:12px;padding:11px 14px;font-size:15px;color:#fff;outline:0}
.scanman button{background:var(--kcal);color:#fff;border-radius:12px;padding:0 18px;font-weight:700}
.scanline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--kcal);opacity:.8;box-shadow:0 0 12px var(--kcal)}
.draftrow{background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:10px}
.draftrow .dr-name{width:100%;background:none;border:0;outline:0;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.draftrow .dr-nums{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}
.draftrow .dr-nums input{width:100%;background:var(--surface);border:0;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);outline:0;text-align:center}
.draftrow .dr-nums label{display:block;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:3px}
.estnote{font-size:12px;color:var(--amber);margin-bottom:12px}
.portrow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.portrow input{width:90px;background:var(--surface2);border:0;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:700;color:var(--ink);outline:0;text-align:center}
.portpreview{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:6px}
.portpreview b{font-size:16px}
.portpreview span{color:var(--dim)}


</style>
</head>
<body>
<div class="top">
  <div class="brand">form.<svg aria-label="brb" viewBox="0 0 1726 757" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" transform="translate(-76 757) scale(1 -1)" d="M76 757V226C76 74 143 0 270 0H416C556 0 644 86 644 264C644 442 556 528 416 528H182V757ZM405 426C497 426 537 378 537 264C537 150 497 103 405 103H301C215 103 182 141 182 231V426Z"/><path fill="#e5321b" transform="translate(619 757) scale(1 -1)" d="M218 528C114 528 75 480 75 374V0H181V358C181 404 202 426 249 426H435V528Z"/><path fill="currentColor" transform="translate(1082 757) scale(1 -1)" d="M76 757V226C76 74 143 0 270 0H416C556 0 644 86 644 264C644 442 556 528 416 528H182V757ZM405 426C497 426 537 378 537 264C537 150 497 103 405 103H301C215 103 182 141 182 231V426Z"/></svg></div>
  <div class="topbtns"><button class="iconbtn" id="themebtn" aria-label="Toggle theme">◐</button><button class="avatar" id="avatar" aria-label="You: sync, targets and ring">A</button></div>
</div>
<div class="dateline" id="dateline"></div>
<div class="titlerow"><button class="navchev" id="prevday" aria-label="Previous day">&lsaquo;</button><h1 class="today" id="daytitle">Today</h1><button class="navchev" id="nextday" aria-label="Next day" disabled>&rsaquo;</button><button class="backchip" id="backtoday" style="display:none">Back to today</button></div>
<div class="weekstrip" id="weekstrip"></div>
<div class="hero">
  <div class="herorow">
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="bankrow" id="bankrow"></div>
</div>
<div class="mealshead"><h2>Meals</h2><span id="mealcount"></span></div>
<div class="meals" id="meals"></div>
<div id="activity"></div>
<div class="quickchips"><button class="qchip">⊞ Saved foods</button><button class="qchip">↻ Recents</button></div>
<div class="logbar"><div class="logbarinner">
  <input id="loginput" placeholder="What did you eat?" autocomplete="off">
  <button class="roundbtn" id="micbtn" aria-label="Voice log">◉</button>

</div></div>
<div class="toast" id="toast"></div>
<div class="scanov" id="scanov">
  <div class="scanhead"><b>Scan barcode</b><button id="scanclose">Cancel</button></div>
  <div class="scanbox" id="scanbox"><div class="scanline"></div></div>
  <div class="scanmsg" id="scanmsg">Point at the barcode.</div>
  <div class="scanman"><input id="scanmanin" inputmode="numeric" placeholder="Or type the barcode number"><button id="scanmanbtn">Look up</button></div>
</div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script>
'use strict';
window.__errs=[];window.addEventListener('error',e=>{__errs.push((e.message||'?')+' @'+e.lineno+':'+e.colno);});
/* ---------- data via data.js module ---------- */
let state=FOODBRB.loadState()||{profile:{},days:{}};
const P=FOODBRB.profile(state), FIBRE_GOAL=P.fibreTarget||30;
const TODAY=FOODBRB.todayKey();
let sel=TODAY; /* selected day key */
const DOWS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const VARIANT=(location.hash.match(/ring=([abc])/)||[])[1]||'a';
const R=61;
function arc(cls,frac,cx,cy,r){const f=Math.max(0,Math.min(1,frac));return '<circle class="'+cls+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke-dasharray="'+(2*Math.PI*r)+'" stroke-dashoffset="'+((1-f)*2*Math.PI*r)+'"/>';}
function fmtDay(k){const d=new Date(k+'T12:00:00');return DOWS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MONS[d.getMonth()];}
function weekOf(k){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const a=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);a.push(FOODBRB.keyOf(x));}return a;}
/* ---------- theme + header ---------- */
const root=document.documentElement;
root.setAttribute('data-theme',localStorage.getItem('foodBrbTheme')||'dark');
document.getElementById('themebtn').onclick=()=>{const n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('foodBrbTheme',n);};
document.getElementById('avatar').textContent=((P.name||'A').trim()[0]||'A').toUpperCase();
{
  const d=new Date(), st=FOODBRB.streak(state);
  document.getElementById('dateline').innerHTML=DOWS[d.getDay()]+' '+d.getDate()+' '+MONS[d.getMonth()]+(st>0?' · <strong>'+st+'-day streak</strong>':'');
}
/* ---------- navigation ---------- */
document.getElementById('prevday').onclick=()=>{sel=FOODBRB.shiftKey(sel,-1);render();};
document.getElementById('nextday').onclick=()=>{if(sel<TODAY){sel=FOODBRB.shiftKey(sel,1);render();}};
document.getElementById('backtoday').onclick=()=>{sel=TODAY;render();};
/* ---------- render ---------- */
let selRing='cal';
function render(){
  let dirty=false;
  const D=state.days[sel]||null, T=FOODBRB.totals(D), isToday=sel===TODAY;
  const wk=weekOf(sel);
  const wkUsed=wk.reduce((a,k)=>{const dd=state.days[k];return a+(FOODBRB.logged(dd)?FOODBRB.totals(dd).kcal:0);},0);
  const wkBudget=P.kcalTarget*7, bankLeft=wkBudget-wkUsed;
  const kcalLeft=P.kcalTarget-T.kcal, over=kcalLeft<0&&FOODBRB.logged(D);
  const ringSteps=FOODBRB.stepsOf(D);

/* ---------- cloud sync (ported from the old app; same worker, same merge) ---------- */
const SYNC_TOKEN_KEY='foodBrbSyncToken', SYNC_REV_KEY='foodBrbSyncRev';
const FOOD_SYNC_API_ORIGIN='https://super-poetry-42d8.ajay-7a2.workers.dev';

let syncTimer=null,syncBusy=false,syncState='off',syncText='Not connected';

function mergeBy(arrA,arrB,key){const m=new Map();for(const x of [...(arrA||[]),...(arrB||[])]){const k=x&&x[key];if(k!=null)m.set(k,Object.assign({},m.get(k)||{},x));}return [...m.values()];}
function mergeCloud(local,remote){if(!remote)return local;const out=Object.assign({v:1},remote,local);out.profile=Object.assign({},remote.profile||{},local.profile||{});out.weights=mergeBy(remote.weights,local.weights,'date');out.days={};for(const k of new Set([...Object.keys(remote.days||{}),...Object.keys(local.days||{})])){const a=remote.days&&remote.days[k]||{},b=local.days&&local.days[k]||{};out.days[k]=Object.assign({},a,b,{foods:mergeBy(a.foods,b.foods,'id')});}return out;}

async function cloudSync(){const token=localStorage.getItem(SYNC_TOKEN_KEY);if(!token||syncBusy)return;syncBusy=true;syncStatus('busy','Syncing...');try{
  let rev=Number(localStorage.getItem(SYNC_REV_KEY)||0);
  let r=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{headers:{Authorization:'Bearer '+token}});
  if(r.status===401){localStorage.removeItem(SYNC_TOKEN_KEY);throw Error('Reconnect cloud sync');}
  if(!r.ok)throw Error('Sync unavailable ('+r.status+')');
  let j=await r.json();state=mergeCloud(state,j.state);rev=j.rev||0;localStorage.setItem(FOODBRB.STORE,JSON.stringify(state));
  let w=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','If-Match':String(rev)},body:JSON.stringify({state:cloudSafe()})});
  if(w.status===409){j=await w.json();state=mergeCloud(state,j.state);w=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','If-Match':String(j.rev)},body:JSON.stringify({state:cloudSafe()})});}
  if(!w.ok)throw Error('Sync could not save');
  j=await w.json();localStorage.setItem(SYNC_REV_KEY,String(j.rev));localStorage.setItem(FOODBRB.STORE,JSON.stringify(state));
  const t=new Date();syncStatus('ok','Synced '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
  render();
}catch(e){syncStatus('err',e.name==='TypeError'?'Sync network blocked':(e.message||'Sync paused'));}finally{syncBusy=false;}}

    e.stopPropagation();
    const id=b.dataset.copy,src=sel,f=findFood(src,id);
    dayPickSheet(day=>{mealPickSheet('Copy to '+fmtDay(day),'Which meal?',f.slot||(f.snack?'snack':'breakfast'),slot=>copyFood(src,id,day,slot));});
  });
}
/* ---------- barcode scanning (Quagga2 + Open Food Facts, ported) ---------- */
let scanLive=false, scanHandler=null;
function loadQuagga(){
  if(window.Quagga)return Promise.resolve();
  if(loadQuagga._p)return loadQuagga._p;
  loadQuagga._p=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    s.onload=()=>window.Quagga?res():rej(new Error('init'));
    s.onerror=()=>rej(new Error('load'));
    document.head.appendChild(s);
  });
  return loadQuagga._p;
}
function parseServing(s){if(!s)return 0;const m=String(s).match(/(\d+(?:\.\d+)?)\s*(?:g|ml)\b/i);return m?parseFloat(m[1]):0;}
async function startScan(){
  const ov=document.getElementById('scanov'),box=document.getElementById('scanbox'),msg=document.getElementById('scanmsg');
  ov.classList.add('on');msg.textContent='Loading scanner...';
  try{await loadQuagga();}catch(e){msg.textContent='Scanner could not load (needs internet the first time). Type the barcode below.';return;}
  try{
    Quagga.init({inputStream:{type:'LiveStream',target:box,constraints:{facingMode:'environment'}},locator:{patchSize:'medium',halfSample:true},numOfWorkers:0,frequency:5,decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader']},locate:true},err=>{
      if(err){msg.textContent='Camera permission was not given. Type the barcode below.';return;}
      scanLive=true;Quagga.start();msg.textContent='Point at the barcode.';
    });
    scanHandler=data=>{
      if(!scanLive)return;
      const code=data&&data.codeResult&&data.codeResult.code;
      if(code){stopScan();lookupBarcode(code);}
    };
    Quagga.onDetected(scanHandler);
  }catch(e){msg.textContent='Camera could not start. Type the barcode below.';}
}
function stopScan(){
  scanLive=false;
  if(scanHandler&&window.Quagga){try{Quagga.offDetected(scanHandler);}catch(e){}}
  scanHandler=null;
  if(window.Quagga){try{Quagga.stop();}catch(e){}}
  document.getElementById('scanov').classList.remove('on');
}
document.getElementById('scanclose').onclick=stopScan;
document.getElementById('scanmanbtn').onclick=()=>{const v=document.getElementById('scanmanin').value.trim();if(v){stopScan();lookupBarcode(v);}};
document.getElementById('scanmanin').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){stopScan();lookupBarcode(v);}}});
async function lookupBarcode(code){
  code=String(code||'').replace(/[^0-9]/g,'');
  if(!code){toast('Enter the barcode number first');return;}
  toast('Looking up '+code+'...');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_size',{headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('http');
    const j=await r.json(),prod=j&&j.product,n=prod&&prod.nutriments||{};
    const kcal=Number(n['energy-kcal_100g']);
    let name=String(prod&&prod.product_name||'').trim();
    const brand=String(prod&&prod.brands||'').trim();
    if(j&&j.status===1&&name&&isFinite(kcal)&&kcal>0){
      if(brand&&name.toLowerCase().indexOf(brand.toLowerCase())<0)name=brand+' '+name;
      const sg=parseServing(prod.serving_size);
      portionSheet({name:name,kcal100:kcal,p100:Number(n['proteins_100g'])||0,c100:Number(n['carbohydrates_100g'])||0,f100:Number(n['fat_100g'])||0,fi100:Number(n['fiber_100g'])||0,serveGrams:sg||0,serveLabel:sg?prod.serving_size:''});
    }else{
      addSheet();
      toast('No data for '+code+' - type it in');
    }
  }catch(e){addSheet();toast('Lookup failed - type it in');}
}

/* ---------- portion sheet: scan result, amount always visible + editable ---------- */
function portionSheet(p){
  const hr=new Date().getHours();
  const def=hr<11?'breakfast':hr<15?'lunch':hr<21?'dinner':'snack';
  const modes=[['g','grams']];
  if(p.serveGrams)modes.push(['s','serving ('+esc(p.serveLabel)+')']);
  openSheet('<h3>'+esc(p.name)+'</h3><div class="sub">Pack data is per 100 g'+(p.serveGrams?' · serving = '+esc(p.serveLabel):' · no serving size on record')+' - set how much you had.</div>'
    +'<div class="fld"><label>Amount</label><div class="portrow"><input id="pt-qty" inputmode="decimal" value="'+(p.serveGrams?'1':'100')+'"><div class="mchiprow" style="margin-bottom:0" id="pt-modes">'
    +modes.map(([v,l],i)=>'<button class="mchip'+(i===(p.serveGrams?1:0)?' sel':'')+'" data-mode="'+v+'">'+l+'</button>').join('')+'</div></div></div>'
    +'<div class="portpreview" id="pt-prev"></div>'
    +'<div class="fld"><label>Meal</label><div class="mchiprow" style="margin-bottom:0">'+SLOTCH.map(([v,l])=>'<button class="mchip'+(v===def?' sel':'')+'" data-meal="'+v+'">'+l+'</button>').join('')+'</div></div>'
    +'<button class="sheetbtn primary" id="pt-save">Add to '+(sel===TODAY?'today':fmtDay(sel))+'</button>'
    +'<button class="sheetbtn ghost" id="shcancel">Cancel</button>');
  let mode=p.serveGrams?'s':'g', meal=def;
  const qty=sheetEl.querySelector('#pt-qty');
  function grams(){const q=parseFloat(qty.value)||0;return (mode==='s'&&p.serveGrams)?q*p.serveGrams:q;}
  function preview(){
    const g=grams();
    sheetEl.querySelector('#pt-prev').innerHTML='<b>'+Math.round(p.kcal100*g/100)+' kcal</b> <span>· P '+Math.round(p.p100*g/100)+'g · C '+Math.round(p.c100*g/100)+'g · F '+Math.round(p.f100*g/100)+'g · Fibre '+Math.round(p.fi100*g/100)+'g ('+Math.round(g)+'g)</span>';
  }
  qty.addEventListener('input',preview);
  sheetEl.querySelectorAll('#pt-modes [data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sheetEl.querySelectorAll('#pt-modes [data-mode]').forEach(x=>x.classList.toggle('sel',x===b));preview();});
  sheetEl.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;sheetEl.querySelectorAll('[data-meal]').forEach(x=>x.classList.toggle('sel',x===b));});
  sheetEl.querySelector('#pt-save').onclick=()=>{
    const g=grams();
    if(g<=0){toast('Amount needed');return;}
    foodsOf(sel).push({id:uid(),name:p.name,kcal:Math.round(p.kcal100*g/100),protein:Math.round(p.p100*g/1000)*10,carbs:Math.round(p.c100*g/1000)*10,fat:Math.round(p.f100*g/1000)*10,fibre:Math.round(p.fi100*g/1000)*10,slot:meal,snack:meal==='snack',source:'barcode'});
    save();closeSheet();render();toast('Added');
  };
  sheetEl.querySelector('#shcancel').onclick=closeSheet;
  preview();
}
/* ---------- sentence logging (Gemini rail) ---------- */
function geminiKey(){return (localStorage.getItem('foodBrbGeminiKey')||'').trim();}
async function estimateSentence(text){
  const prompt='You estimate nutrition for a food diary. Split this into individual foods. Reply with ONLY a JSON array, no markdown: [{"name":"plain item name with portion","kcal":number,"protein":number,"carbs":number,"fat":number,"fibre":number}]. Use typical portions when unclear. Vegetarian context. Sentence: '+text;
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':geminiKey()},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})
  });
  if(!r.ok)throw new Error('gemini '+r.status);
  const j=await r.json();
  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text||'';
  const arr=JSON.parse(t.replace(/```json|```/g,'').trim());
  return arr.filter(x=>x&&x.name&&isFinite(Number(x.kcal))).map(x=>({name:String(x.name),kcal:Math.round(Number(x.kcal))||0,protein:Math.round(Number(x.protein)*10)/10||0,carbs:Math.round(Number(x.carbs)*10)/10||0,fat:Math.round(Number(x.fat)*10)/10||0,fibre:Math.round(Number(x.fibre)*10)/10||0}));
}
function draftSheet(items){
  const hr=new Date().getHours();
  const def=hr<11?'breakfast':hr<15?'lunch':hr<21?'dinner':'snack';
  openSheet('<h3>Log meal</h3><div class="estnote">AI estimates - check and edit anything before logging.</div>'
    +items.map((f,i)=>'<div class="draftrow"><input class="dr-name" data-i="'+i+'" data-f="name" value="'+esc(f.name)+'">'
      +'<div class="dr-nums">'
      +'<div><label>kcal</label><input inputmode="numeric" data-i="'+i+'" data-f="kcal" value="'+f.kcal+'"></div>'
      +'<div><label>P</label><input inputmode="decimal" data-i="'+i+'" data-f="protein" value="'+f.protein+'"></div>'
      +'<div><label>C</label><input inputmode="decimal" data-i="'+i+'" data-f="carbs" value="'+f.carbs+'"></div>'
      +'<div><label>F</label><input inputmode="decimal" data-i="'+i+'" data-f="fat" value="'+f.fat+'"></div>'
      +'</div></div>').join('')
    +'<div class="fld"><label>Meal</label><div class="mchiprow" style="margin-bottom:0">'+SLOTCH.map(([v,l])=>'<button class="mchip'+(v===def?' sel':'')+'" data-meal="'+v+'">'+l+'</button>').join('')+'</div></div>'
    +'<button class="sheetbtn primary" id="df-log">Log to '+(sel===TODAY?'today':fmtDay(sel))+'</button>'
    +'<button class="sheetbtn ghost" id="shcancel">Cancel</button>');
  let meal=def;
  sheetEl.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;sheetEl.querySelectorAll('[data-meal]').forEach(x=>x.classList.toggle('sel',x===b));});
  sheetEl.querySelector('#df-log').onclick=()=>{
    sheetEl.querySelectorAll('.draftrow input').forEach(inp=>{
      const it=items[+inp.dataset.i],f=inp.dataset.f;
      it[f]=f==='name'?inp.value.trim():num(inp.value);
    });
    const good=items.filter(it=>it.name&&it.kcal);
    if(!good.length){toast('Nothing to log');return;}
    for(const it of good)foodsOf(sel).push({id:uid(),name:it.name,kcal:it.kcal,protein:it.protein,carbs:it.carbs,fat:it.fat,fibre:it.fibre,slot:meal,snack:meal==='snack',source:'estimate'});
    save();closeSheet();render();toast('Logged '+good.length+' item'+(good.length>1?'s':''));
  };
  sheetEl.querySelector('#shcancel').onclick=closeSheet;
}
/* ---------- log bar ---------- */
document.getElementById('plusbtn').onclick=addSheet;
document.getElementById('micbtn').onclick=()=>toast('Voice logging comes after sentence logging');
const loginput=document.getElementById('loginput');
loginput.addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.trim();if(!v)return;
  e.target.value='';
  if(!geminiKey()){addSheet();sheetEl.querySelector('#af-name').value=v;return;}
  loginput.placeholder='Estimating...';loginput.disabled=true;
  try{
    const items=await estimateSentence(v);
    if(items.length)draftSheet(items);
    else{addSheet();sheetEl.querySelector('#af-name').value=v;}
  }catch(err){toast('Estimate failed - quick add instead');addSheet();sheetEl.querySelector('#af-name').value=v;}
  loginput.placeholder='What did you eat?';loginput.disabled=false;
});

{let purged=false;for(const k of Object.keys(state.days||{})){const fs=state.days[k]&&state.days[k].foods;if(fs){const n=fs.filter(f=>!(f.id&&String(f.id).indexOf('est-')===0));if(n.length!==fs.length){state.days[k].foods=n;purged=true;}}}if(purged)save();}
