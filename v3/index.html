<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cap">
<meta name="theme-color" content="#131114">
<title>form.brb</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="fonts.css"></noscript><link rel="stylesheet" href="sg.css" media="print" onload="this.media='all'">
<style>
:root{
  --kcal:#E5321B; --kcal-hi:#ff725f; --protein:#6f7fbf; --protein-hi:#aab6ff; --fibre:#d9a441; --fibre-hi:#ffd06b; --steps:#85818a;
  --green:#3f9d6b; --amber:#d9a441; --grey:#5c5860;
  --page:#131114; --surface:#1d1a1e; --surface2:#262228; --ink:#f2eef2; --dim:#9a939e; --hair:#332e35;
}
[data-theme=light]{
  --page:#f4f1f5; --surface:#ffffff; --surface2:#efeaf1; --ink:#221e24; --dim:#6f6873; --hair:#e2dce4;
  --steps:#6f6873;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{overscroll-behavior-y:none}
body{background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(205px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.brand{display:flex;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.brand svg{height:14px;width:auto;margin-left:1px;transform:translateY(1px)}
.topbtns{display:flex;gap:8px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--dim)}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.dateline{padding:6px 20px 0;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.dateline strong{color:var(--ink);font-weight:600}
.titlerow{display:flex;align-items:center;gap:10px;padding:2px 20px 10px}
h1.today{font-size:25px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navchev{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface2);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center}
.navchev:disabled{opacity:.3}
.backchip{flex:0 0 auto;background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--protein-hi);letter-spacing:.4px}
[data-theme=light] .backchip{color:var(--protein)}
.weekstrip{display:flex;justify-content:space-between;padding:2px 20px 14px}
.daycol{display:flex;flex-direction:column;align-items:center;gap:6px;width:34px;border-radius:12px;padding:4px 0}
.daycol .dow{font-size:11px;color:var(--dim);font-weight:600}
.daycol.sel{background:var(--surface2)}
.daycol.sel .dow{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,#3a353c)}
.dot.hollow{background:transparent;border:1.5px solid var(--grey);width:6px;height:6px}
.hero{margin:0 16px;background:var(--surface);border-radius:22px;padding:20px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.herorow{display:flex;align-items:center;gap:20px}
.ringwrap{position:relative;width:138px;height:138px;flex:0 0 auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringtrack{fill:none;stroke:var(--surface2);stroke-width:7}
.ringarc{fill:none;stroke:var(--kcal);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringarc.bank{stroke:var(--protein);stroke-width:4;opacity:.9}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcenter .big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ringcenter .big.over{color:var(--kcal)}
.ringcenter .lbl{font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-top:4px}
.ringcenter .bankin{font-size:11px;color:var(--protein);margin-top:6px;font-weight:600}
.stack{width:148px;height:148px;position:relative;flex:0 0 auto}
.stack svg{transform:rotate(-90deg)}
.stack .rk{fill:none;stroke:var(--surface2);stroke-width:10}
.stack .rv{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.stack .rv.cal{stroke:var(--kcal)}
.stack .rv.pro{stroke:var(--protein)}
.stack .rv.fib{stroke:var(--fibre)}
.stack .scenter{position:absolute;inset:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scenter .big{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1}
.scenter .big.over{color:var(--kcal)}
.scenter .lbl{font-size:9px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lline{padding:6px 10px;border-left:3px solid var(--c);background:var(--surface2);border-radius:0 10px 10px 0;cursor:pointer}
.lline b{display:block;font-size:13px}
.lline span{color:var(--dim);font-size:11px}
.actcard{margin:16px 16px 0;background:var(--surface);border-radius:18px;padding:16px 16px 18px}
.actcard h2{margin:0 0 10px;font-size:15px}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--surface2);border-radius:12px;padding:9px 10px}
.act .k{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.act .n{font-size:15px;font-weight:700;margin-top:3px}
.sparkwrap{padding-top:16px;padding-bottom:16px;margin-top:4px}
.spark{position:relative;display:flex;align-items:flex-end;gap:6px;height:56px}
.spark .target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--dim);opacity:.55;pointer-events:none}
.spark .tlbl{position:absolute;right:0;font-size:9px;color:var(--dim);pointer-events:none}
.spark i{flex:1;background:var(--surface2);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.spark i em{display:none}
.spark i.today{background:linear-gradient(var(--kcal-hi),var(--kcal))}
.spark i .sv{position:absolute;bottom:calc(100% + 3px);left:0;right:0;text-align:center;font-size:9px;color:var(--dim);font-weight:600;font-style:normal}
.act .q{font-size:10px;color:var(--dim);margin-top:2px;font-weight:600}
.prow{margin-top:12px}
.prow .ph{display:flex;justify-content:space-between;align-items:baseline;font-size:11px}
.prow .pl{color:var(--dim);font-weight:700;letter-spacing:.4px;font-size:10px}
.prow .pv{color:var(--ink);font-weight:600}
.pbar{height:6px;border-radius:3px;background:var(--surface2);position:relative;margin:5px 0 3px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.pbar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--dim);border-radius:1px}
.prow .ps{font-size:10px;color:var(--dim)}
.slabel{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.slabel span{font-weight:600;letter-spacing:0}
.wchart{width:100%;max-width:420px;height:auto;display:block;margin:6px auto 0}
.spark b{position:absolute;top:calc(100% + 4px);left:0;right:0;text-align:center;font-size:9px;color:var(--dim);font-weight:600}
.spark i u{position:absolute;left:0;right:0;bottom:0;border:1.5px solid var(--steps);border-bottom:0;opacity:.65;border-radius:4px 4px 0 0}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block;vertical-align:baseline}
.syncdot.ok{background:var(--green)}.syncdot.busy{background:var(--amber)}.syncdot.err{background:var(--kcal)}
.yhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.yava{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#E5321B,#961d10);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface2)}
.yrow .yl{font-size:13px;color:var(--dim)}
.yrow .yv{font-size:13px;font-weight:600;text-align:right}
.ynote{font-size:11px;color:var(--dim);margin-top:12px;line-height:1.5}
button.avatar{cursor:pointer;border:0;font:inherit}

.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px}
.mrow .mtop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px}
.mrow .mname{color:var(--dim);font-weight:600}
.mrow .mval{font-weight:700}
.mrow .mval .goal{color:var(--dim);font-weight:500;font-size:12px}
.mrow .mval.over{color:var(--kcal)}
.mbar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bankhair{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bankhair i{display:block;height:100%;background:var(--protein);border-radius:2px}
.bankhairlbl{font-size:10px;color:var(--dim);margin-top:4px;text-align:right}
.bankrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:13px}
.bankrow .bl{color:var(--dim);font-weight:600}
.bankrow .bv{font-weight:700}
.bankrow .bv strong{color:var(--protein)}
.mealshead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 8px}
.mealshead h2{font-size:17px;font-weight:800}
.mealshead span{font-size:12px;color:var(--dim)}
.meals{margin:0 16px;display:flex;flex-direction:column;gap:10px}
.mealcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.mealcard .thumb{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.mealcard .minfo{flex:1;min-width:0}
.mealcard .mname2{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mealcard .mmacros{font-size:12px;color:var(--dim);margin-top:2px}
.mealcard .mmacros .mprot{color:var(--ink);font-weight:700}.mealcard .mmacros .mamt{color:var(--dim)}
.mealcard .mkcal{font-weight:800;font-size:15px;white-space:nowrap}
.mealcard .mkcal span{font-size:11px;color:var(--dim);font-weight:500}
.quickchips{display:flex;gap:8px;padding:16px 20px 4px}
.qchip{background:var(--surface2);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
.emptylog{padding:26px 20px;text-align:center;color:var(--dim);font-size:13px}
.logbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;padding:10px 14px;background:linear-gradient(transparent,var(--page) 28%)}
.chiprow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 4px 8px}
.chiprow:empty{display:none}
.suggest{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--surface2);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;display:none;max-height:46vh;overflow-y:auto}
.suggest.on{display:block}
.fldrel{position:relative}
.suggest.below{left:0;right:0;top:calc(100% + 6px);bottom:auto}
.suggrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--surface2);width:100%;text-align:left;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;border-radius:0}
.suggrow:last-child{border-bottom:0}
.suggrow .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.suggrow .sk{color:var(--dim);font-size:12px;flex-shrink:0}
#ptr{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;margin-left:-19px;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--surface2);display:grid;place-items:center;opacity:0;z-index:60;pointer-events:none;transition:opacity .15s}
.ptrring{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--surface2);border-top-color:var(--kcal)}
#ptr.spin .ptrring{animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.logchip{background:var(--surface);border:1px solid var(--surface2);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logchip:active{transform:scale(.96)}
.logbarinner{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 10px 34px rgba(0,0,0,.3)}
.logbarinner input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:16px}
.logbarinner input::placeholder{color:var(--dim)}
.roundbtn{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim);flex:0 0 auto}
.roundbtn.primary{background:var(--kcal);color:#fff;font-size:20px;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--hair);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--dim);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.sel{color:var(--kcal)}
[data-tab=train] #view-food,[data-tab=train] .logbar{display:none}
#view-train{display:none;padding:8px 16px 130px}
.exrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.exname{font-weight:700;font-size:15px}
.exsub{font-size:12px;color:var(--dim);margin-top:2px}
.exgo{color:var(--dim);font-size:20px;padding-left:10px}
.exchart{width:100%;height:auto;margin:10px 0 14px}
.setrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
.setrow input{width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:var(--surface2);border:0;border-radius:12px;padding:12px;color:var(--ink);font-size:16px;font-family:inherit;outline:0}
.setrow label,.exfld label{display:block;font-size:10px;letter-spacing:.08em;color:var(--dim);margin:0 0 4px 2px;text-transform:uppercase;font-weight:600}
.exfld{margin-bottom:12px}
.exfld input[type=date]{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:var(--surface2);border:0;border-radius:12px;padding:12px;color:var(--ink);font-size:16px;font-family:inherit;outline:0;color-scheme:dark;-webkit-appearance:none;appearance:none}
[data-theme=light] .exfld input[type=date]{color-scheme:light}
.setdel{background:var(--surface2);border:0;border-radius:12px;color:var(--dim);width:42px;height:45px;font-size:16px;font-family:inherit}
.segrow{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.segbtn{flex:1;border:0;border-radius:9px;background:transparent;color:var(--dim);font-size:14px;font-weight:600;padding:9px 0;font-family:inherit}
.segbtn.sel{background:var(--surface);color:var(--ink)}
.exsess{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.exsess .d{font-size:12px;color:var(--dim);font-weight:600}
.exsess .s{font-size:15px;font-weight:700;margin-top:2px}
.trseg{display:flex;gap:6px;padding:2px 20px 12px}
.trseg button{flex:1;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:8px 0;font-size:12px;font-weight:700;color:var(--dim);font-family:inherit}
.trseg button.sel{color:var(--kcal);border-color:var(--kcal)}
.trpad{padding:0 20px}
.trbw{padding:0 20px 12px;font-size:12px;color:var(--dim);font-weight:600}
.trset{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-top:8px}
.trsetn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface2);color:var(--dim);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trsetw{min-width:70px}
.trtgt{margin-left:auto;color:var(--dim);font-size:12px;font-weight:700}
.trsetsum{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;padding:8px 0;border-bottom:1px solid var(--hair)}
.eqpick{width:100%;background:var(--surface2);border:0;border-radius:12px;padding:12px;color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;text-align:left}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:11px 14px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.restlab{font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:700}
.resttime{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer}
.restbtn{margin-left:auto;background:var(--surface2);border:0;border-radius:10px;color:var(--dim);font-size:12px;font-weight:700;padding:7px 12px;font-family:inherit}
.restx{background:var(--surface2);border:0;border-radius:10px;color:var(--dim);width:30px;height:30px;font-size:15px;font-family:inherit}
.rtmove{display:flex;gap:6px;margin-top:8px}
.rtmove button{background:var(--surface2);border:0;border-radius:8px;color:var(--dim);width:34px;height:26px;font-size:13px;font-family:inherit}
.rtmove .rtcardbtn{width:auto;height:auto;background:var(--surface2);border:0;border-radius:8px;color:var(--ink);font-size:12px;font-weight:700;padding:7px 16px;font-family:inherit}
.restadj{background:var(--surface2);border:0;border-radius:10px;color:var(--ink);font-size:12px;font-weight:700;padding:7px 10px;font-family:inherit}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:12px;padding:13px 14px;margin-bottom:6px;color:var(--ink);font-size:15px;font-weight:600;font-family:inherit}
.picksearch{width:100%;box-sizing:border-box;background:var(--surface2);border:0;border-radius:12px;padding:13px 14px;color:var(--ink);font-size:16px;font-family:inherit;outline:0;margin-bottom:10px}
[data-tab=train] #view-train{display:block}
.trainph svg{width:44px;height:44px;color:var(--dim);margin-bottom:14px}
.trainph h2{font-size:20px;font-weight:800;margin-bottom:6px}
.trainph p{font-size:13px;color:var(--dim);max-width:260px;margin:0 auto;line-height:1.5}
.toast{z-index:60;position:fixed;left:50%;bottom:168px;transform:translateX(-50%);background:var(--surface2);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.mealhead{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;background:var(--page);padding:12px 4px 6px;font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim)}
.mealhead span{font-weight:600;letter-spacing:0;text-transform:none}
.mealhead.tappable{cursor:pointer}
.mealhead.tappable:active{color:var(--ink)}
.mealwrap{position:relative;border-radius:18px;overflow:hidden}
.swipebg{position:absolute;inset:0;display:flex;align-items:center;padding:0;border-radius:18px;background:var(--surface2);overflow:hidden}

<script>/* food.brb v3 - data layer. Direction-independent: reads the shared food.brb
   state (same origin localStorage, same schema as the live app + worker).
   Pure logic only - no rendering. Keeps his 65 days, MFP pipeline and sync
   working untouched (read-only here; writes stay with the live app until the
   auth/accounts session). */
'use strict';
window.FOODBRB = (function(){
  const STORE='sadhana-v1';
  const SYNC_TOKEN_KEY='foodBrbSyncToken';
  const SYNC_API='https://super-poetry-42d8.ajay-7a2.workers.dev/data';

  function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE))||null; }catch(e){ return null; } }
  function saveState(s){ localStorage.setItem(STORE, JSON.stringify(s)); }

  function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayKey(){ return keyOf(new Date()); }
  function shiftKey(k,n){ const d=new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return keyOf(d); }
  function weekKeys(offset){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+(offset||0)*7); const a=[]; for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); a.push(keyOf(x)); } return a; }
  function lastDays(n){ const a=[]; const d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); a.push(keyOf(x)); } return a; }

  function totals(day){ const t={kcal:0,protein:0,fat:0,carbs:0,fibre:0};
    for(const f of (day&&day.foods)||[]){ t.kcal+=f.kcal||0; t.protein+=f.protein||0; t.fat+=f.fat||0; t.carbs+=f.carbs||0; t.fibre+=f.fibre||0; }
    t.kcal=Math.round(t.kcal); t.protein=Math.round(t.protein*10)/10; return t; }

  function stepsOf(day){ return day&&day.ring&&day.ring.steps!=null?day.ring.steps:(day&&day.steps)||null; }
  function logged(day){ return !!(day&&day.foods&&day.foods.length); }

  function profile(state){ return Object.assign({kcalTarget:1400,proteinTarget:90,stepsTarget:8000,fibreTarget:30},(state&&state.profile)||{}); }

  /* weekly bank: budget = daily target x 7; used = logged kcal this week; bank = remainder */
  function bank(state, offset){
    const p=profile(state), keys=weekKeys(offset);
    const used=keys.reduce((a,k)=>{ const d=state.days[k]; return a+(logged(d)?totals(d).kcal:0); },0);
    const budget=p.kcalTarget*7;
    return {keys, used, budget, left:budget-used};
  }

  /* per-day outcome for the dots: future | none | under | over */
  function dayOutcome(state, k, tk){
    tk=tk||todayKey();
    if(k>tk) return 'future';
    const d=state.days[k];
    if(!logged(d)) return 'none';
    return totals(d).kcal>profile(state).kcalTarget ? 'over' : 'under';
  }

  function streak(state){
    let n=0; const d=new Date(); const has=k=>logged(state.days[k]);
    if(!has(keyOf(d))) d.setDate(d.getDate()-1);
    while(has(keyOf(d))){ n++; d.setDate(d.getDate()-1); } return n;
  }

  /* suggestion engine port: frequency-ranked foods per slot, 90-day window */
  function mealPatterns(state, mealSlot, limit){
    const map=new Map(), cutoff=shiftKey(todayKey(),-90), tk=todayKey();
    Object.keys(state.days).filter(k=>k>=cutoff&&k<=tk).sort().forEach(k=>{
      for(const f of (state.days[k]&&state.days[k].foods)||[]){
        const sl=f.slot||(f.snack?'snack':'breakfast'); if(sl!==mealSlot) continue;
        const key=(f.name||'').trim().toLowerCase(); if(!key) continue;
        const x=map.get(key)||{food:f,count:0,last:k}; x.count++; if(k>=x.last){ x.last=k; x.food=f; } map.set(key,x);
      }
    });
    return [...map.values()].sort((a,b)=>(b.count-a.count)||(b.last.localeCompare(a.last))).slice(0,limit||5);
  }

  /* read-only worker fetch (token already on device from the live app) */
  async function fetchWorker(){
    const tok=localStorage.getItem(SYNC_TOKEN_KEY); if(!tok) return {error:'no-token'};
    const r=await fetch(SYNC_API,{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok) return {error:'http-'+r.status};
    const j=await r.json(); return {state:j.state, rev:j.rev, updatedAt:j.updatedAt};
  }

  return { loadState, saveState, keyOf, todayKey, shiftKey, weekKeys, lastDays, totals, stepsOf, logged, profile, bank, dayOutcome, streak, mealPatterns, fetchWorker, STORE };
})();
</script>

/* ---------- cloud sync (ported from the old app; same worker, same merge) ---------- */
const SYNC_TOKEN_KEY='foodBrbSyncToken', SYNC_REV_KEY='foodBrbSyncRev';
const FOOD_SYNC_API_ORIGIN='https://super-poetry-42d8.ajay-7a2.workers.dev';
const ULTRAHUMAN_SYNC_ORIGIN='https://food-brb-ultrahuman.ajay-7a2.workers.dev';
let syncTimer=null,syncBusy=false,syncState='off',syncText='Not connected';
function syncStatus(s,t){syncState=s;syncText=t;}
function mergeBy(arrA,arrB,key){const m=new Map();for(const x of [...(arrA||[]),...(arrB||[])]){const k=x&&x[key];if(k!=null)m.set(k,Object.assign({},m.get(k)||{},x));}return [...m.values()];}
function mergeCloud(local,remote){if(!remote)return local;const out=Object.assign({v:1},remote,local);out.profile=Object.assign({},remote.profile||{},local.profile||{});out.weights=mergeBy(remote.weights,local.weights,'date');const deleted=new Set([...(remote.deletedIds||[]),...(local.deletedIds||[])]);out.deletedIds=[...deleted].slice(-500);out.workouts=mergeBy(remote.workouts,local.workouts,'id').filter(x=>!deleted.has(x.id));out.exercises=[...new Set([...(remote.exercises||[]),...(local.exercises||[])])];out.exmeta=Object.assign({},remote.exmeta||{},local.exmeta||{});out.days={};for(const k of new Set([...Object.keys(remote.days||{}),...Object.keys(local.days||{})])){const a=remote.days&&remote.days[k]||{},b=local.days&&local.days[k]||{};out.days[k]=Object.assign({},a,b,{foods:mergeBy(a.foods,b.foods,'id').filter(x=>!deleted.has(x.id))});}return out;}
function cloudSafe(){const x=JSON.parse(JSON.stringify(state));delete x.photos;if(x.profile)delete x.profile.geminiKey;return x;}
async function cloudSync(){const token=localStorage.getItem(SYNC_TOKEN_KEY);if(!token||syncBusy)return;syncBusy=true;syncStatus('busy','Syncing...');try{
  let rev=Number(localStorage.getItem(SYNC_REV_KEY)||0);
  let r=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{headers:{Authorization:'Bearer '+token}});
  if(r.status===401){localStorage.removeItem(SYNC_TOKEN_KEY);throw Error('Reconnect cloud sync');}
  if(!r.ok)throw Error('Sync unavailable ('+r.status+')');
  let j=await r.json();state=mergeCloud(state,j.state);rev=j.rev||0;localStorage.setItem(FOODBRB.STORE,JSON.stringify(state));
  let w=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','If-Match':String(rev)},body:JSON.stringify({state:cloudSafe()})});
  if(w.status===409){j=await w.json();state=mergeCloud(state,j.state);w=await fetch(FOOD_SYNC_API_ORIGIN+'/data',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','If-Match':String(j.rev)},body:JSON.stringify({state:cloudSafe()})});}
  if(!w.ok)throw Error('Sync could not save');
  j=await w.json();localStorage.setItem(SYNC_REV_KEY,String(j.rev));localStorage.setItem(FOODBRB.STORE,JSON.stringify(state));
  P=FOODBRB.profile(state);FIBRE_GOAL=P.fibreTarget||30;
  const t=new Date();syncStatus('ok','Synced '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
  render();
  if(window.__onbRestore){const f=window.__onbRestore;window.__onbRestore=null;f(true);}
}catch(e){syncStatus('err',e.name==='TypeError'?'Sync network blocked':(e.message||'Sync paused'));if(window.__onbRestore){const f=window.__onbRestore;window.__onbRestore=null;f(false);}}finally{syncBusy=false;}}
function scheduleCloudSync(){if(!localStorage.getItem(SYNC_TOKEN_KEY))return;clearTimeout(syncTimer);syncTimer=setTimeout(cloudSync,700);}
function connectCloudSync(){window.open(FOOD_SYNC_API_ORIGIN+'/connect','foodBrbCloudSync','width=520,height=680');}
async function connectScale(){const token=localStorage.getItem(SYNC_TOKEN_KEY);if(!token){toast('Connect cloud sync first');return;}try{const r=await fetch(FOOD_SYNC_API_ORIGIN+'/withings/auth?format=json',{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(j.url)window.open(j.url,'foodBrbScale','width=520,height=680');else toast('Scale link unavailable');}catch(e){toast('Scale link unavailable');}}
window.addEventListener('message',e=>{if((e.origin!==ULTRAHUMAN_SYNC_ORIGIN&&e.origin!==FOOD_SYNC_API_ORIGIN)||!e.data||e.data.type!=='food-brb-sync-token')return;localStorage.setItem(SYNC_TOKEN_KEY,e.data.token);localStorage.setItem(SYNC_REV_KEY,'0');cloudSync();});
/* ---------- Ultrahuman ring sync (ported) ---------- */
let ringSyncWindow=null;
function dayOf(k){if(!state.days[k])state.days[k]={};return state.days[k];}
function startRingSync(){
  const dates=FOODBRB.lastDays(7).join(',');
  ringSyncWindow=window.open(ULTRAHUMAN_SYNC_ORIGIN+'/sync?dates='+encodeURIComponent(dates),'foodBrbRingSync','popup,width=520,height=680');
  if(!ringSyncWindow)toast('Allow pop-ups for form.brb, then tap Sync ring again.');
}
window.addEventListener('message',e=>{
  if(e.origin!==ULTRAHUMAN_SYNC_ORIGIN||e.source!==ringSyncWindow||!e.data||e.data.type!=='food-brb-ultrahuman'||!Array.isArray(e.data.days))return;
  let days=0;
  for(const r of e.data.days){if(!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||r.error)continue;const out={};
    for(const k of ['sleep_score','total_sleep','time_in_bed','sleep_efficiency','recovery_score','avg_sleep_hrv','sleep_rhr','steps','active_minutes','temperature_deviation','vo2_max','movement_index','metabolic_score','spo2'])if(r[k]!=null&&(['number','string','boolean'].includes(typeof r[k])))out[k]=r[k];
    dayOf(r.date).ring=out;days++;
  }
  ringSyncWindow=null;save();render();toast('Ring synced: '+days+' days.');
});
function lastRingDay(){const ks=Object.keys(state.days).filter(k=>state.days[k]&&state.days[k].ring).sort();return ks.length?ks[ks.length-1]:null;}

function foodsOf(k){const d=state.days[k]=state.days[k]||{};d.foods=d.foods||[];return d.foods;}
function findFood(k,id){return foodsOf(k).find(f=>f.id===id);}
const SLOTCH=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
/* ---------- sheet ---------- */
const sheetbg=document.getElementById('sheetbg'), sheetEl=document.getElementById('sheet');
function openSheet(html){sheetEl.innerHTML=html;sheetbg.classList.add('on');sheetEl.classList.add('on');}
function closeSheet(){sheetbg.classList.remove('on');sheetEl.classList.remove('on');}
sheetbg.onclick=closeSheet;
function mealPickSheet(title,sub,def,onpick){
  openSheet('<h3>'+title+'</h3><div class="sub">'+sub+'</div><div class="mchiprow">'
    +SLOTCH.map(([v,l])=>'<button class="mchip'+(v===def?' sel':'')+'" data-meal="'+v+'">'+l+'</button>').join('')
    +'</div><button class="sheetbtn ghost" id="shcancel">Cancel</button>');

function dayPickSheet(onpick){
  const rows=[];
  for(let i=0;i<7;i++){
    const k=FOODBRB.shiftKey(TODAY,-i);
    rows.push('<button class="dayrow" data-day="'+k+'">'+(i===0?'Today':i===1?'Yesterday':fmtDay(k))+'<span>'+fmtDay(k)+'</span></button>');

function copyFood(fromDay,id,toDay,slot){
  const f=findFood(fromDay,id);if(!f)return;
  const c={id:uid(),name:f.name,kcal:f.kcal||0,protein:f.protein||0,carbs:f.carbs||0,fat:f.fat||0,fibre:f.fibre||0,slot:slot,snack:slot==='snack',source:'copy'};
  if(f.g>0&&f.base){c.g=f.g;c.base=f.base;}if(f.pm>0&&f.pbase){c.pm=f.pm;c.pbase=f.pbase;}
  foodsOf(toDay).push(c);save();
  if(toDay===sel||fromDay===sel)render();
  toast('Copied to '+(toDay===TODAY?'today':fmtDay(toDay)));
}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
/* ---------- edit sheet ---------- */
function editSheet(dayKey,id){
  const f=findFood(dayKey,id);if(!f)return;
  const cur=f.slot||(f.snack?'snack':'breakfast');
  let EBASE=f.base&&f.g>0?f.base:null,EG=f.g>0?f.g:0,UNIT='g',SC=100,INNAME=false;
  if(!EBASE&&f.pbase&&f.pm>0){EBASE=f.pbase;EG=f.pm;UNIT='x';SC=1;}
  if(!EBASE){const m=String(f.name||'').match(/,\s*(\d+(?:\.\d+)?)\s*g\s*$/i),gg=m?parseFloat(m[1]):0;
    if(gg>0&&(f.kcal||0)>0){const k=100/gg;EBASE={k:(f.kcal||0)*k,p:(f.protein||0)*k,c:(f.carbs||0)*k,f:(f.fat||0)*k,fi:(f.fibre||0)*k};EG=gg;}}
  if(!EBASE&&(f.kcal||0)>0){
    const m2=String(f.name||'').match(/(\d+(?:\.\d+)?)\s*g\b/i),g2=m2?parseFloat(m2[1]):0;
    if(g2>=5){const k=100/g2;EBASE={k:(f.kcal||0)*k,p:(f.protein||0)*k,c:(f.carbs||0)*k,f:(f.fat||0)*k,fi:(f.fibre||0)*k};EG=g2;INNAME=true;}
    else{EBASE={k:f.kcal||0,p:f.protein||0,c:f.carbs||0,f:f.fat||0,fi:f.fibre||0};EG=1;UNIT='x';SC=1;}
  }
  openSheet('<h3>Edit food</h3><div class="sub">'+esc(fmtDay(dayKey))+'</div>'
    +'<div class="fld fldrel"><label>Name</label><input id="ef-name" value="'+esc(f.name||'')+'"><div class="suggest below" id="ef-suggest"></div></div>'
    +'<div class="fld"><label>Meal</label><div class="mchiprow" style="margin-bottom:0">'+SLOTCH.map(([v,l])=>'<button class="mchip'+(v===cur?' sel':'')+'" data-meal="'+v+'">'+l+'</button>').join('')+'</div></div>'
    +(EBASE?'<div class="fld"><label>'+(UNIT==='g'?'Amount (g)':'Portions (1 = as logged)')+'</label><input id="ef-g" inputmode="decimal" value="'+EG+'"><div class="ynote" style="margin-top:6px">'+(UNIT==='g'?'Change the grams and the calories and macros rescale.':'Type 1.5 for one and a half portions and the calories and macros rescale.')+'</div></div>':'')
    +'<div class="fld"><label>Calories</label><input id="ef-kcal" inputmode="numeric" value="'+(f.kcal||0)+'"></div>'
    +'<div class="grid3">'
    +'<div class="fld"><label>Protein g</label><input id="ef-p" inputmode="decimal" value="'+(f.protein||0)+'"></div>'
    +'<div class="fld"><label>Carbs g</label><input id="ef-c" inputmode="decimal" value="'+(f.carbs||0)+'"></div>'
    +'<div class="fld"><label>Fat g</label><input id="ef-f" inputmode="decimal" value="'+(f.fat||0)+'"></div></div>'
    +'<div class="fld" style="margin-top:12px"><label>Fibre g</label><input id="ef-fi" inputmode="decimal" value="'+(f.fibre||0)+'"></div>'
    +'<button class="sheetbtn primary" id="ef-save">Save</button>'
    +'<button class="sheetbtn danger" id="ef-del">Delete</button>'
    +'<button class="sheetbtn ghost" id="shcancel">Cancel</button>');
  let meal=cur,manual=false;
  const egI=sheetEl.querySelector('#ef-g');
  if(egI){
    egI.addEventListener('focus',()=>{try{egI.select();}catch(e){}});
    egI.addEventListener('input',()=>{const g=parseFloat(egI.value)||0,r1=v=>Math.round(v*10)/10;
      sheetEl.querySelector('#ef-kcal').value=Math.round(EBASE.k*g/SC);
      sheetEl.querySelector('#ef-p').value=r1(EBASE.p*g/SC);sheetEl.querySelector('#ef-c').value=r1(EBASE.c*g/SC);
      sheetEl.querySelector('#ef-f').value=r1(EBASE.f*g/SC);sheetEl.querySelector('#ef-fi').value=r1(EBASE.fi*g/SC);manual=false;});
    ['#ef-kcal','#ef-p','#ef-c','#ef-f','#ef-fi'].forEach(q=>sheetEl.querySelector(q).addEventListener('input',()=>{manual=true;}));
  }
  sheetEl.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;sheetEl.querySelectorAll('[data-meal]').forEach(x=>x.classList.toggle('sel',x===b));});
  wireSheetTypeahead('#ef-name','#ef-suggest',s=>{
    manual=true;
    sheetEl.querySelector('#ef-name').value=s.name;
    sheetEl.querySelector('#ef-kcal').value=s.kcal;
    sheetEl.querySelector('#ef-p').value=s.protein;
    sheetEl.querySelector('#ef-c').value=s.carbs;
    sheetEl.querySelector('#ef-f').value=s.fat;
    sheetEl.querySelector('#ef-fi').value=s.fibre||0;
  });
  sheetEl.querySelector('#ef-save').onclick=()=>{
    const name=sheetEl.querySelector('#ef-name').value.trim();
    if(!name){toast('Name needed');return;}
    f.name=name;f.kcal=num(sheetEl.querySelector('#ef-kcal').value);
    f.protein=num(sheetEl.querySelector('#ef-p').value);f.carbs=num(sheetEl.querySelector('#ef-c').value);
    f.fat=num(sheetEl.querySelector('#ef-f').value);f.fibre=num(sheetEl.querySelector('#ef-fi').value);
    if(egI){const g=parseFloat(egI.value)||0;
      if(manual||g<=0){delete f.base;delete f.g;delete f.pbase;delete f.pm;}
      else if(UNIT==='x'){f.pbase=EBASE;f.pm=Math.round(g*100)/100;delete f.base;delete f.g;}
      else{f.base=EBASE;f.g=Math.round(g*10)/10;delete f.pbase;delete f.pm;
        if(g!==EG&&INNAME){const mm=f.name.match(/(\d+(?:\.\d+)?)(\s*g\b)/i);if(mm)f.name=f.name.replace(mm[0],f.g+mm[2]);}
        else if(g!==EG){const suf=', '+f.g+' g';f.name=f.name.replace(/\s*\(\d[\d.]*\s*(small|medium|large)\)\s*$/i,suf).replace(/,\s*\d+(\.\d+)?\s*g\s*$/i,suf);if(f.name.indexOf(suf)<0)f.name=f.name+suf;}}}
    f.slot=meal;f.snack=meal==='snack';
    save();closeSheet();render();toast('Saved');
  };
  const del=sheetEl.querySelector('#ef-del');
  del.onclick=()=>{
    const arr=foodsOf(dayKey),i=arr.findIndex(x=>x.id===id);
    if(i>=0){const rm=arr.splice(i,1)[0];if(rm&&rm.id)state.deletedIds=[...(state.deletedIds||[]),rm.id].slice(-500);}
    save();closeSheet();render();toast('Deleted');
  };
  cfm(del,'Tap again to delete');
  sheetEl.querySelector('#shcancel').onclick=closeSheet;
}
/* ---------- previous items (history search) ---------- */
function historyFoods(){
  const seen={}, out=[];
  Object.keys(state.days||{}).sort().reverse().forEach(k=>{
    (foodsOf(k)||[]).forEach(f=>{
      if(!f||!f.name)return;
      const key=f.name.trim().toLowerCase(); if(!key||seen[key])return;
      seen[key]=1;
      out.push({name:f.name.trim(),kcal:f.kcal||0,protein:f.protein||0,carbs:f.carbs||0,fat:f.fat||0,fibre:f.fibre||0,slot:f.slot||(f.snack?'snack':'breakfast')});
    });
  });
  return out;
}
function prevSheet(){
  const all=historyFoods();
  openSheet('<h3>Previous items</h3><div class="sub">Everything you have logged before, newest first.</div>'
    +'<div class="fld"><input id="pv-q" placeholder="Search - e.g. chai" autocomplete="off"></div>'
    +'<div id="pv-list"></div><div id="pv-db"></div>'
    +'<button class="sheetbtn ghost" id="shcancel">Cancel</button>');
  const list=sheetEl.querySelector('#pv-list');
  const draw=q=>{
    const ql=(q||'').trim().toLowerCase();
    const hits=(ql?all.filter(f=>f.name.toLowerCase().indexOf(ql)>=0):all).slice(0,40);
    list.innerHTML=hits.length?hits.map((f,i)=>'<div class="yrow tappable pvrow" data-i="'+i+'"><span class="yl" style="color:var(--ink)">'+esc(f.name)+'</span><span class="yv">'+f.kcal+' kcal</span></div>').join(''):'<div class="sub" style="padding:12px 0">No personal matches yet - quick add it instead.</div>';
    list.querySelectorAll('.pvrow').forEach(b=>b.onclick=()=>{const f=hits[+b.dataset.i];closeSheet();addSheet(f);});
    const fu=fruitUnitFor(ql);
    if(fu){const up=fruitPortion(fu,ql),row=document.createElement('div');row.className='yrow tappable pvrow';row.innerHTML='<span class="yl" style="color:var(--ink)">'+esc(fu.name)+', whole (small, medium, large)</span><span class="yv">'+Math.round(fu.k*fu.sz[1][1]/100)+' kcal</span>';row.onclick=()=>portionSheet(up);list.insertBefore(row,list.firstChild);}
    const dbbox=sheetEl.querySelector('#pv-db');
    if(ql.length>=2){loadFoodDB().then(()=>{
      const seen={};hits.forEach(f=>seen[f.name.toLowerCase()]=1);
      const dh=dbMatches(ql,seen).slice(0,8);
      dbbox.innerHTML=dh.length?'<div class="sub" style="margin-top:14px">Common foods - per 100 g (USDA)</div>'+dh.map((f,i)=>'<div class="yrow tappable dbrow" data-i="'+i+'"><span class="yl" style="color:var(--ink)">'+esc(f.name)+'</span><span class="yv">'+f.kcal+' kcal</span></div>').join(''):'';
      dbbox.querySelectorAll('.dbrow').forEach(b=>b.onclick=()=>{const f=dh[+b.dataset.i];closeSheet();addSheet(f);});
    });}else dbbox.innerHTML='';
  };
  sheetEl.querySelector('#pv-q').addEventListener('input',e=>draw(e.target.value));
  sheetEl.querySelector('#shcancel').onclick=closeSheet;
  draw('');
  setTimeout(()=>{const q=sheetEl.querySelector('#pv-q');if(q)q.focus();},300);
}
/* ---------- built-in food database (USDA FDC SR Legacy, per 100 g) + typeahead ---------- */
let fooddbLoading=null;
function loadFoodDB(){
  if(window.FOODDB)return Promise.resolve();
  if(fooddbLoading)return fooddbLoading;
  fooddbLoading=new Promise(res=>{
    const s=document.createElement('script');s.src='foods-db.js';
    s.onload=()=>res();s.onerror=()=>{window.FOODDB=[];res();};
    document.head.appendChild(s);
  });
  return fooddbLoading;
}
function dbMatches(ql,exclude){
  if(!window.FOODDB||!ql||ql.length<2)return [];
  const out=[];
  for(const a of window.FOODDB){
    const nl=a[0].toLowerCase();const i=nl.indexOf(ql);
    if(i<0)continue;
    const key=a[0].toLowerCase();if(exclude&&exclude[key])continue;
    out.push({name:a[0]+', 100 g',kcal:a[1],protein:a[2],carbs:a[3],fat:a[4],fibre:a[5],score:(i===0?0:2)+nl.length/500});
  }
  out.sort((a,b)=>a.score-b.score);
  return out;
}
function suggRows(ql){
  if(!ql||ql.length<2)return [];
  const hist=historyFoods().filter(f=>f.name.toLowerCase().indexOf(ql)>=0);
  hist.sort((a,b)=>a.name.toLowerCase().indexOf(ql)-b.name.toLowerCase().indexOf(ql));
  const seen={};hist.forEach(f=>seen[f.name.toLowerCase()]=1);
  const db=dbMatches(ql,seen);
  const fu=fruitUnitFor(ql),urow=fu?[{f:{name:fu.name+', whole (small, medium, large)',kcal:Math.round(fu.k*fu.sz[1][1]/100),protein:0,carbs:0,fat:0,fibre:0,unit:fruitPortion(fu,ql)},hist:false,unit:true}]:[];
  return urow.concat(hist.slice(0,4).map(f=>({f,hist:true}))).concat(db.slice(0,6).map(f=>({f,hist:false}))).slice(0,6);
}
function drawSuggestInto(box,input,onPick){
  if(!box)return;
  const rows=suggRows(input.value.trim().toLowerCase());
  if(!rows.length){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=rows.map((s,i)=>'<button class="suggrow" data-i="'+i+'"><span class="sm">'+(s.hist?'↻ ':'')+esc(s.f.name)+'</span><span class="sk">'+s.f.kcal+' kcal</span></button>').join('');
  box.classList.add('on');
  box.querySelectorAll('.suggrow').forEach(b=>b.onclick=()=>{
    const s=rows[+b.dataset.i].f;
    box.classList.remove('on');box.innerHTML='';
    if(s.unit){hideSuggest();if(typeof loginput!=='undefined'&&input===loginput)loginput.value='';portionSheet(s.unit);return;}
    onPick(s);
  });
}
function drawSuggest(){
  drawSuggestInto(document.getElementById('suggest'),loginput,s=>{
    loginput.value='';
    draftSheet([{name:s.name,kcal:s.kcal,protein:s.protein,carbs:s.carbs,fat:s.fat,fibre:s.fibre}]);
  });
}
function wireSheetTypeahead(nameSel,boxSel,fill){
  const inp=sheetEl.querySelector(nameSel),box=sheetEl.querySelector(boxSel);
  if(!inp||!box)return;
  let t=null;
  inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>loadFoodDB().then(()=>drawSuggestInto(box,inp,fill)),120);});
  inp.addEventListener('focus',()=>{if(inp.value.trim().length>=2)loadFoodDB().then(()=>drawSuggestInto(box,inp,fill));});
  inp.addEventListener('blur',()=>setTimeout(()=>{box.classList.remove('on');box.innerHTML='';},200));
}
function hideSuggest(){const box=document.getElementById('suggest');if(box){box.classList.remove('on');box.innerHTML='';}}
/* ---------- quick add ---------- */

  openSheet('<h3>Add food</h3><div class="sub">Quick add - estimates come with sentence logging.</div>'

  let portBase=null;

    }else{wrap.style.display='none';portBase=null;}
  }
  sheetEl.querySelector('#af-portion').addEventListener('input',()=>{
    if(!portBase||!portBase.g)return;

    sheetEl.querySelector('#af-f').value=Math.round(portBase.f*k*10)/10;
    preFibre=Math.round(portBase.fi*k*10)/10;
    sheetEl.querySelector('#af-name').value=sheetEl.querySelector('#af-name').value.replace(/,\s*\d+(?:\.\d+)?\s*g\s*$/i,', '+(Math.round(g*10)/10)+' g');
  });
  maybePortion();
  sheetEl.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{meal=b.dataset.meal;sheetEl.querySelectorAll('[data-meal]').forEach(x=>x.classList.toggle('sel',x===b));});
  sheetEl.querySelector('#af-scan').onclick=()=>{closeSheet();startScan();};
  sheetEl.querySelector('#af-label').onclick=()=>{closeSheet();document.getElementById('labfile').click();};

/* ---------- meal row handlers: tap edit, swipe copy, hover copy ---------- */
/* swipe direction: -1 = swipe left deletes, swipe right gives Edit and Copy to. 1 = the reverse. */
const SWDEL=-1;
function attachMealHandlers(){
  document.querySelectorAll('.mealcard').forEach(card=>{
    const id=card.dataset.id;
    const WL=SWDEL<0?96:156,WR=SWDEL<0?156:96;/* panel widths revealed by moving left / right */
    card._o=0;

let scanLive=false, scanHandler=null;
function loadQuagga(){
  if(window.Quagga)return Promise.resolve();
  if(loadQuagga._p)return loadQuagga._p;
  loadQuagga._p=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    s.onload=()=>window.Quagga?res():rej(new Error('init'));
    s.onerror=()=>rej(new Error('load'));
    document.head.appendChild(s);
  });
  return loadQuagga._p;
}
function parseServing(s){if(!s)return 0;const m=String(s).match(/(\d+(?:\.\d+)?)\s*(?:g|ml)\b/i);return m?parseFloat(m[1]):0;}
async function startScan(){
  const ov=document.getElementById('scanov'),box=document.getElementById('scanbox'),msg=document.getElementById('scanmsg');
  ov.classList.add('on');msg.textContent='Loading scanner...';
  try{await loadQuagga();}catch(e){msg.textContent='Scanner could not load (needs internet the first time). Type the barcode below.';return;}
  msg.textContent='Starting camera...';
  try{
    Quagga.init({inputStream:{type:'LiveStream',target:box,constraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}},locator:{patchSize:'medium',halfSample:true},numOfWorkers:2,frequency:10,decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader']},locate:true},err=>{
      if(err){msg.textContent='Camera permission was not given. Type the barcode below.';return;}
      msg.textContent='Point at the barcode.';scanLive=true;Quagga.start();

      if(!scanLive)return;
      const code=data&&data.codeResult&&data.codeResult.code;

    Quagga.onDetected(scanHandler);
  }catch(e){msg.textContent='Camera could not start. Type the barcode below.';}
}
function stopScan(){

async function lookupBarcode(code){
  code=String(code||'').replace(/[^0-9]/g,'');
  if(!code){toast('Enter the barcode number first');return;}
  toast('Looking up '+code+'...');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_size',{headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('http');
    const j=await r.json(),prod=j&&j.product,n=prod&&prod.nutriments||{};
    const kcal=Number(n['energy-kcal_100g']);
    let name=String(prod&&prod.product_name||'').trim();
    name=name.replace(/#+/g,' ').replace(/\s{2,}/g,' ').trim();
    const brand=String(prod&&prod.brands||'').trim();
    if(j&&j.status===1&&name&&isFinite(kcal)&&kcal>0){
      if(brand&&name.toLowerCase().indexOf(brand.toLowerCase())<0)name=brand+' '+name;
      const sg=parseServing(prod.serving_size);
      portionSheet({name:name,kcal100:kcal,p100:Number(n['proteins_100g'])||0,c100:Number(n['carbohydrates_100g'])||0,f100:Number(n['fat_100g'])||0,fi100:Number(n['fiber_100g'])||0,serveGrams:sg||0,serveLabel:sg?prod.serving_size:''});
    }else{
      if(draftCtx)replaceSheet();else addSheet();
      toast('No data for '+code+' - type it in');
    }
  }catch(e){if(draftCtx)replaceSheet();else addSheet();toast('Lookup failed - type it in');}
}

/* Progression engine. Original to form.brb. Pure: no DOM, no storage. Weights in one unit (the caller converts).
   rule: {mode:'linear'|'double', step, repMin, repMax, sets, reps}. sessions: oldest first, [{date, sets:[{w,r}]}]. */
const PROG_DELOAD=0.9,PROG_STALLS=2;
function progStep(unit,eq){const small=eq==='dumbbell'||eq==='cable';return unit==='lbs'?(small?2:5):(small?1:2.5);}
function progRound(x,step){return step>0?Math.round(x/step)*step:x;}
function progClean(x){return Math.round(x*100)/100;}
function progWork(s){let top=0;s.sets.forEach(x=>{if(x.w>top)top=x.w;});const ws=s.sets.filter(x=>x.w===top);return {top:top,n:ws.length,min:Math.min.apply(null,ws.map(x=>x.r))};}
function progFmtSets(s){return s.sets.map(x=>x.r).join(', ');}
function nextTarget(rule,sessions,unit){
  unit=unit||'kg';
  const step=rule.step>0?rule.step:progStep(unit),dbl=rule.mode==='double';
  const rMin=rule.repMin||rule.reps||8,rMax=Math.max(rule.repMax||rMin,rMin);
  const tReps=dbl?rMin:(rule.reps||rMin);
  const setsN=rule.sets||0;
  const hist=(sessions||[]).filter(s=>s&&s.sets&&s.sets.some(x=>x.r>0));
  if(!hist.length)return {weight:null,reps:tReps,sets:setsN||null,reason:'No history yet. Your first session sets the starting weight.',stalls:0,deload:false};
  const f=progWork(hist[0]);
  if(f.top===0){ // bodyweight: reps only
    const l=progWork(hist[hist.length-1]);const goal=dbl?rMax:(rule.reps||rMax);
    if(l.min>=goal)return {weight:0,reps:goal,sets:setsN||l.n,reason:'Bodyweight: you hit '+goal+' reps on every set. Try a harder variation or add weight.',stalls:0,deload:false};
    return {weight:0,reps:Math.min(goal,l.min+1),sets:setsN||l.n,reason:'Bodyweight: last time '+progFmtSets(hist[hist.length-1])+' reps, so aim for '+Math.min(goal,l.min+1)+' on every set.',stalls:0,deload:false};
  }
  let plan={w:f.top,reps:dbl?Math.min(rMax,f.min+1):tReps},stalls=0,why='',deload=false;
  const first=progWork(hist[0]);
  // first session sets the baseline: it is judged against its own target
  const judge=(s,pl)=>{const w=progWork(s);const okSets=!setsN||w.n>=setsN;return {w:w,hit:w.top>=pl.w&&w.min>=pl.reps&&(dbl||okSets)};};
  let start=0;
  { // baseline: treat session 0 as if it was planned at its own weight and target reps
    const pl={w:first.top,reps:tReps};const j=judge(hist[0],pl);
    if(dbl){ if(first.min>=rMax){plan={w:first.top+step,reps:rMin};why='up';}else{plan={w:first.top,reps:Math.min(rMax,first.min+1)};why='rep';} }
    else if(j.hit){plan={w:first.top+step,reps:tReps};why='up';}
    else {plan={w:first.top,reps:tReps};stalls=1;why='stall';}
    start=1;
  }
  let last=hist[0],lastDeload=false;
  for(let i=start;i<hist.length;i++){
    const s=hist[i],w=progWork(s),pl=plan;const j=judge(s,pl);last=s;lastDeload=false;
    if(j.hit){
      stalls=0;
      if(dbl){ if(w.min>=rMax){plan={w:w.top+step,reps:rMin};why='up';}else{plan={w:w.top,reps:Math.min(rMax,w.min+1)};why='rep';} }
      else {plan={w:w.top+step,reps:tReps};why='up';}
    } else {
      stalls++;why='stall';
      plan={w:pl.w<=w.top?w.top:pl.w,reps:pl.reps};
      if(stalls>=PROG_STALLS){
        plan={w:Math.max(step,progRound(w.top*PROG_DELOAD,step)),reps:dbl?rMin:tReps};
        stalls=0;why='deload';lastDeload=true;
      }
    }
  }
  const l=progWork(last),u=unit;
  const nm=x=>progClean(x)+' '+u;
  let reason;
  if(why==='up')reason='You hit '+(dbl?'the top of the range':'every target rep')+' at '+nm(l.top)+' last time ('+progFmtSets(last)+'), so go up '+nm(step)+'.';
  else if(why==='rep')reason='Last time '+nm(l.top)+' for '+progFmtSets(last)+'. Same weight, aim for '+plan.reps+' reps on every set.';
  else if(why==='deload')reason='Two sessions in a row short of target at '+nm(l.top)+', so a 10% deload to '+nm(plan.w)+'. Build back up from there.';
  else reason='Last time '+nm(l.top)+' for '+progFmtSets(last)+', short of '+plan.reps+' reps. Same weight again. One more miss and it deloads by 10%.';
  return {weight:progClean(plan.w),reps:plan.reps,sets:setsN||l.n,reason:reason,stalls:stalls,deload:why==='deload'};
}
/*PROG-END*/

function progSessions(name,unit){
  const by={};exEntries().filter(w=>w.exercise===name&&w.sets&&w.sets.length).forEach(w=>{
    const k=(w.unit==='lbs'?1:0)!==(unit==='lbs'?1:0)?(unit==='lbs'?1/LB2KG:LB2KG):1;
    (by[w.date]=by[w.date]||[]).push.apply(by[w.date],w.sets.map(x=>({w:Math.round((+x.w||0)*k*100)/100,r:+x.r||0})));});
  return Object.keys(by).sort().map(d=>({date:d,sets:by[d]}));}
function progRule(it,unit){const p=it.prog;if(!p||p.mode==='off'||!p.mode)return null;
  return {mode:p.mode,step:p.step>0?p.step:progStep(unit,exMeta(it.exercise).e),repMin:p.repMin||it.reps,repMax:p.repMax||(it.reps+4),sets:it.sets,reps:it.reps};}
/* Guided workout. Original to form.brb. State lives in localStorage (foodBrbGW) until the workout ends; every logged set is written to state.workouts straight away. */
let gw=null,mmD=null;
function gwLoad(){try{const g=JSON.parse(localStorage.getItem('foodBrbGW')||'null');if(g&&g.items&&g.date&&(Date.now()-g.start)<20*36e5)return g;}catch(e){}return null;}
function gwPersist(){if(gw)localStorage.setItem('foodBrbGW',JSON.stringify(gw));}
function gwFig(name){
  if(!mmD)mmD=JSON.parse(document.getElementById('mmdata').textContent);
  const mu=mmOf(name),fill={};
  mu.s.forEach(k=>(MMG[k]||[]).forEach(sl=>fill[sl]=.4));mu.p.forEach(k=>(MMG[k]||[]).forEach(sl=>fill[sl]=1));
  return ['f','k'].map(v=>{const D=mmD[v];let g='';
    Object.keys(D.m).forEach(sl=>{const o=fill[sl];g+='<path d="'+D.m[sl]+'" style="fill:'+(o?'var(--kcal)':'var(--hair)')+';fill-opacity:'+(o||1)+'"/>';});
    return '<svg viewBox="'+(v==='f'?'0':'718')+' 95 727 1280" aria-hidden="true"><path d="'+D.b+'" style="fill:var(--surface2)"/>'+g+'</svg>';}).join('');}
function gwPrep(i){
  const it=gw.items[i],name=it.exercise,unit=exUnitFor(name),last=exLast(name);
  let sets=[];
  for(let k=0;k<(it.sets||3);k++){const b=last&&last.sets.length?(last.sets[k]||last.sets[last.sets.length-1]):null;sets.push({w:b?b.w:'',r:b?b.r:it.reps,d:0});}
  
  let why='';
  const rl=progRule(it,unit);
  if(rl){const nt=nextTarget(rl,progSessions(name,unit),unit);why=nt.reason;
    if(nt.weight!=null)sets=sets.map(()=>({w:nt.weight,r:nt.reps,d:0}));}
  gw.ex[i]={name:name,unit:unit,sets:sets,why:why,last:last?'Last time: '+exSummary(last)+' on '+fmtDay(last.date):'First time logging this one.',lastNote:last&&last.note?last.note:'',note:'',timed:gwTimedFor(it),eid:null};
}
function gwSync(i){
  const ex=gw.ex[i];if(!ex)return;
  const clean=ex.sets.filter(s=>s.d&&(parseInt(s.r)||0)>0).map(s=>({w:parseFloat(s.w)||0,r:parseInt(s.r)||0}));
  const wk=state.workouts||[];
  if(!clean.length){
    if(ex.eid){state.workouts=wk.filter(x=>x.id!==ex.eid);if(state.deletedIds)state.deletedIds.push(ex.eid);ex.eid=null;}
  } else if(!ex.eid){

    state.workouts=wk.concat([Object.assign({id:ex.eid,date:gw.date,exercise:ex.name,unit:ex.unit,eq:exMeta(ex.name).e,sets:clean},ex.note?{note:ex.note}:{},ex.timed?{t:1}:{})]);
    if(!EXEQ[ex.name]&&!(state.exmeta&&state.exmeta[ex.name])){state.exmeta=state.exmeta||{};state.exmeta[ex.name]={e:exMeta(ex.name).e,m:exMeta(ex.name).m||''};}

function gwStart(id){

/* Muscle map. Body silhouette paths: MuscleMapJS by Abdofallah (MIT), whose artwork derives from MuscleMap by Melih Colpan (MIT).
   Paths simplified to 1 decimal. Exercise-to-muscle table and all logic are original to form.brb. */
const MMG={ch:['chest'],sh:['deltoids'],bi:['biceps'],tr:['triceps'],fo:['forearm'],ab:['abs','obliques'],tp:['trapezius'],ub:['upper-back'],lb:['lower-back'],gl:['gluteal'],qd:['quadriceps'],hm:['hamstring'],cv:['calves']};

const EXMUS={'Back Squat':'qd gl|hm lb ab','Front Squat':'qd|gl ab','Leg Press':'qd gl|hm','Hack Squat':'qd|gl','Lunge':'qd gl|hm','Romanian Deadlift':'hm gl|lb fo tp','Deadlift':'hm gl lb|qd tp ub fo','Hip Thrust':'gl|hm qd','Leg Curl':'hm|cv','Leg Extension':'qd|','Calf Raise':'cv|','Bench Press':'ch|tr sh','Incline Bench Press':'ch sh|tr','Overhead Press':'sh|tr tp','Dumbbell Shoulder Press':'sh|tr','Chest Fly':'ch|sh','Push-Up':'ch|tr sh ab','Dip':'ch tr|sh','Pull-Up':'ub|bi fo','Lat Pulldown':'ub|bi fo','Barbell Row':'ub|bi lb tp fo','Dumbbell Row':'ub|bi tp fo','Seated Row':'ub|bi tp fo','Face Pull':'sh tp|ub','Bicep Curl':'bi|fo','Hammer Curl':'bi fo|','Triceps Pushdown':'tr|','Triceps Extension':'tr|','Lateral Raise':'sh|tp','Plank':'ab|lb','Crunch':'ab|','Chest Press':'ch|tr sh','Shoulder Press':'sh|tr'};

function mmOf(name){const m=state.exmeta&&state.exmeta[name];
  if(m&&m.m2)return {p:m.m2.p||[],s:m.m2.s||[]};
  const k=EXMUS[name]||MMCOARSE[exMeta(name).m||''];if(!k)return {p:[],s:[]};
  const a=k.split('|');return {p:a[0].split(' ').filter(Boolean),s:(a[1]||'').split(' ').filter(Boolean)};}
function mmStats(){
  const st={};MMORDER.forEach(k=>st[k]={sets:0,vol:0,last:''});
  const d7=FOODBRB.shiftKey(TODAY,-6);
  exEntries().forEach(w=>{const mu=mmOf(w.exercise);if(!w.sets||!w.sets.length)return;
    const v=w.t?0:w.sets.reduce((x,s)=>x+(+s.w||0)*(+s.r||0)*(w.unit==='lbs'?LB2KG:1),0);
    [[mu.p,1],[mu.s,.5]].forEach(a=>a[0].forEach(k=>{const o=st[k];if(!o)return;
      if(!o.last||w.date>o.last)o.last=w.date;
      if(w.date>=d7){o.sets+=w.sets.length*a[1];o.vol+=v*a[1];}}));});
  return st;}

function gDow(k){return (new Date(k+'T12:00:00').getDay()+6)%7;}
function gWeekStart(k){return FOODBRB.shiftKey(k,-gDow(k));}
function gStats(days){
  const keys=Object.keys(days).sort(),mo=TODAY.slice(0,7);
  const total=keys.length,thisM=keys.filter(k=>k.slice(0,7)===mo).length;
  const wk=new Set(keys.map(gWeekStart));let ws=gWeekStart(TODAY),streak=0;
  if(!wk.has(ws))ws=FOODBRB.shiftKey(ws,-7);
  while(wk.has(ws)){streak++;ws=FOODBRB.shiftKey(ws,-7);}
  const from=FOODBRB.shiftKey(TODAY,-30);
  const wts=(state.weights||[]).filter(w=>w.date>=from&&w.date<=TODAY).sort((a,b)=>a.date<b.date?-1:1);
  const wd=wts.length>1?Math.round((wts[wts.length-1].kg-wts[0].kg)*10)/10:null;
  return {total:total,thisM:thisM,streak:streak,wd:wd};
}
function gHeat(days){

  const vals=[];for(let c=0;c<52;c++)for(let r=0;r<7;r++){const k=FOODBRB.shiftKey(startW,c*7+r);if(k<=TODAY){const v=val(k);if(v>0)vals.push(v);}}
  vals.sort((a,b)=>a-b);
  const lvl=v=>{if(!v)return 0;const q=vals.indexOf(v)/Math.max(1,vals.length-1);return q>.75?4:q>.5?3:q>.25?2:1;};
  let g='',lab='',lastM='';
  for(let c=0;c<52;c++){
    const top=FOODBRB.shiftKey(startW,c*7);const m=top.slice(0,7);

      g+='<rect x="'+(c*7)+'" y="'+(9+r*7)+'" width="5.6" height="5.6" rx="1.3" style="fill:'+(l?'var(--kcal)':'var(--hair)')+';fill-opacity:'+(l?[0,.28,.5,.75,1][l]:.7)+'"/>';}

    +'<svg viewBox="0 0 364 58" style="width:100%;height:auto;display:block;margin-top:10px" role="img" aria-label="Training activity heatmap">'+lab+g+'</svg>'
    +'<div class="ynote" style="margin:6px 0 0">'+(none?(tm?'Time appears after your first guided workout. Older entries have no recorded duration, so none is guessed.':'Each square is a day. It fills in as you log workouts.'):(tm?'Minutes from guided workouts (start to finish).':'Volume = weight x reps, in kg.'))+'</div></div>';
}
function gRangeStats(days){
  const from=days>=9999?'0000-00-00':FOODBRB.shiftKey(TODAY,-(days-1));const st={};MMORDER.forEach(k=>st[k]={sets:0});
  exEntries().forEach(w=>{if(w.date<from||!w.sets||!w.sets.length)return;const mu=mmOf(w.exercise);[[mu.p,1],[mu.s,.5]].forEach(a=>a[0].forEach(k=>{if(st[k])st[k].sets+=w.sets.length*a[1];}));});
  return st;
}
function gCard(days){

      +MMORDER.map(k=>'<div class="trset"><span>'+MMNAME[k]+'</span><span class="trtgt">'+(Math.round(st[k].sets*2)/2)+' sets</span></div><div class="pbar" style="margin:2px 0 8px"><i style="width:'+Math.round(st[k].sets/mx*100)+'%;background:var(--kcal)"></i></div>').join('')+'</div>';

      return '<div class="trset"><span>'+MMNAME[k]+'</span><span class="trtgt">'+(Math.round(a*2)/2)+' sets &middot; usual '+(Math.round(u*2)/2)+(u>0||a>0?' &middot; '+(d>0?'+':'')+d:'')+'</span></div>';}).join('')+'</div>'

      const ds=Object.keys(by).sort();if(!ds.length)return;const f=by[ds[0]],l=by[ds[ds.length-1]],d=Math.round(l-f);

function gOverview(){

function gWire(el){

  el.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{gTab=b.dataset.gt;trTrends();});

function trTrends(){
  const el=document.getElementById('trainbody');if(!el)return;
  const all=exEntries();
  if(!all.length){el.innerHTML='<div class="trpad">'+gOverview()+mmSection(true)+'<div class="ynote">Trends appear once you have logged a few sessions.</div></div>';gWire(el);return;}
  const d7=FOODBRB.shiftKey(TODAY,-6),d14=FOODBRB.shiftKey(TODAY,-13),dPrev=FOODBRB.shiftKey(TODAY,-7);

  const dlv=(a,b,u)=>{const d=a-b;return d===0?'&middot; no change':'&middot; '+(d>0?'+':'')+d.toLocaleString()+' '+u+' vs before';};

    +'</div>';

  const mOrder=['legs','chest','back','shoulders','arms','core','other'];

      +mRows.map(r=>'<div class="trset"><span style="text-transform:capitalize">'+r.m+'</span><span class="trtgt">'+r.n+' sets</span></div><div class="pbar" style="margin:2px 0 8px"><i style="width:'+Math.round(r.n/mx*100)+'%;background:var(--kcal)"></i></div>').join('')
      +'</div>';
  } else h+='<div class="ynote">No sets logged in the last 7 days.</div>';
  const names=exNamesLogged();
  h+='<div class="slabel" style="margin-top:16px">BEST SET &middot; ESTIMATED 1RM</div><div class="exsess" style="cursor:default">'
    +names.map(n=>{
      let best=null,be=0;

    }).join('')+'</div>';
  const yr=all.filter(w=>w.date<=FOODBRB.shiftKey(TODAY,-300));

    const byEx={};yr.forEach(w=>{if(!byEx[w.exercise]||byEx[w.exercise].date<w.date)byEx[w.exercise]=w;});

function exChart(pts){
  if(!pts.length)return '';
  const W=320,H=72,PADL=34,PADR=8,PADT=10,PADB=14;
  let mn=Math.min.apply(null,pts.map(p=>p.kg)),mx=Math.max.apply(null,pts.map(p=>p.kg));
  if(mx-mn<2){mn-=1;mx+=1;}else{mn-=1;mx+=1;}
  const X=i=>PADL+(pts.length===1?0.5:i/(pts.length-1))*(W-PADL-PADR);
  const Y=v=>PADT+(mx-v)/(mx-mn)*(H-PADT-PADB);
  let s='<svg class="exchart" viewBox="0 0 '+W+' '+H+'">';
  if(pts.length>1)s+='<polyline points="'+pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.kg).toFixed(1)).join(' ')+'" fill="none" stroke="var(--kcal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  s+=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="'+(i===pts.length-1?3.5:2.5)+'" fill="'+(i===pts.length-1?'var(--kcal)':'var(--steps)')+'"/>').join('');
  s+='<text x="0" y="'+(Y(mx)+3).toFixed(1)+'" fill="var(--dim)" font-size="8">'+mx.toFixed(1)+'</text><text x="0" y="'+(Y(mn)+3).toFixed(1)+'" fill="var(--dim)" font-size="8">'+mn.toFixed(1)+'</text>';
  s+='<text x="'+PADL+'" y="'+(H-2)+'" fill="var(--dim)" font-size="8">'+fmtDay(pts[0].d)+'</text><text x="'+(W-PADR)+'" y="'+(H-2)+'" fill="var(--dim)" font-size="8" text-anchor="end">'+fmtDay(pts[pts.length-1].d)+'</text>';
  return s+'</svg>';
}

/* ---------- predictive meal chips (Ore-style, client-side) ---------- */
function predictChips(){
  const hr=new Date().getHours();
  const slot=hr<11?'breakfast':hr<15?'lunch':hr<21?'dinner':'snack';
  const dow=new Date().getDay();
  const agg={};
  Object.keys(state.days||{}).forEach(k=>{
    const d=new Date(k+'T12:00:00'); if(isNaN(d))return;
    const daysAgo=Math.max(0,(Date.now()-d.getTime())/86400000);
    ((state.days[k]||{}).foods||[]).forEach(f=>{
      if(!f||!f.name)return;
      const key=f.name.trim().toLowerCase(); if(!key)return;
      const a=agg[key]||(agg[key]={count:0,last:1e9,slotHits:0,dowHits:0,lastDate:'',f:null});
      a.count++;
      a.last=Math.min(a.last,daysAgo);
      if((f.slot||(f.snack?'snack':'breakfast'))===slot)a.slotHits++;
      if(d.getDay()===dow)a.dowHits++;
      if(k>=a.lastDate){a.lastDate=k;a.f={name:f.name.trim(),kcal:f.kcal||0,protein:f.protein||0,carbs:f.carbs||0,fat:f.fat||0,fibre:f.fibre||0};}
    });
  });
  const todayLogged={};
  (foodsOf(sel)||[]).forEach(f=>{if(f&&f.name)todayLogged[f.name.trim().toLowerCase()]=1;});
  const out=[];
  for(const key in agg){
    const a=agg[key];
    if(a.count<2||!a.f)continue;
    if(todayLogged[key])continue;
    const rec=Math.pow(0.5,a.last/14);
    const slotBoost=a.slotHits>0?1.5+0.5*(a.slotHits/a.count):1;
    const dowBoost=a.dowHits>0?1.15:1;
    out.push({f:a.f,score:a.count*rec*slotBoost*dowBoost});
  }
  out.sort((x,y)=>y.score-x.score);
  return out.slice(0,3).map(o=>o.f);
}

function onbAge(dob){const d=new Date(dob+'T12:00:00'); if(isNaN(d))return null; const n=new Date(); let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate()))a--; return (a>=10&&a<=100)?a:null;}
function onbHeightCm(a){if(a.hUnit==='cm')return num(a.cm); return num(a.ft)*30.48+num(a.in)*2.54;}
function onbWeightKg(a){if(a.wUnit==='kg')return num(a.kg); return num(a.st)*6.35029+num(a.lb)*0.453592;}
function onbTargetKg(a){if(a.noTarget)return null; if(a.tUnit==='kg')return num(a.tKg)||null; const v=num(a.tSt)*6.35029+num(a.tLb)*0.453592; return v||null;}
function computePlan(a){
  const age=onbAge(a.dob), cm=onbHeightCm(a), kg=onbWeightKg(a), tKg=onbTargetKg(a);
  const bmr=10*kg+6.25*cm-5*age+(a.sex==='male'?5:-161);
  const af=a.day==='physical'?1.7:a.day==='feet'?1.55:1.4;
  const maintenance=Math.max(1200,Math.round(bmr*af/10)*10);
  let daily=maintenance;
  if(a.goal==='lose')daily=Math.round(maintenance*0.8/10)*10;
  if(a.goal==='build')daily=Math.round(maintenance*1.1/10)*10;
  daily=Math.max(1200,daily);
  const pKg=tKg||kg;
  const protein=Math.round(pKg*(a.goal==='build'?2:a.goal==='lose'?1.8:1.6));
  const steps=a.day==='physical'?12000:a.day==='feet'?10000:8000;
  return {maintenance,daily,protein,fibre:30,steps,age,cm,kg,tKg};
}

/* ---------- pull to refresh (sync + reload to newest build) ---------- */
let ptrY=null, ptrPull=0, ptrBusy=false;
window.addEventListener('touchstart',e=>{
  if(ptrBusy)return;
  let ok=window.scrollY<=2&&!sheetEl.classList.contains('on')&&!document.getElementById('onb').classList.contains('on')&&!document.getElementById('revov').classList.contains('on');
  for(let n=e.target;ok&&n&&n!==document.body&&n.nodeType===1;n=n.parentNode){if(n.scrollTop>0)ok=false;}
  ptrY=ok?e.touches[0].clientY:null;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(ptrY===null)return;
  const dy=e.touches[0].clientY-ptrY;
  if(dy>0&&window.scrollY<=2){
    ptrPull=Math.min(dy,150);
    const p=document.getElementById('ptr');
    p.style.opacity=Math.min(1,ptrPull/70);
    p.style.transform='translateY('+(ptrPull*0.45)+'px)';
  }else{ptrPull=0;document.getElementById('ptr').style.opacity='0';}
},{passive:true});
window.addEventListener('touchend',()=>{
  if(ptrY===null)return;
  const p=document.getElementById('ptr');
  if(ptrPull>70){ptrBusy=true;p.classList.add('spin');p.style.opacity='1';p.style.transform='translateY(40px)';doRefresh();}
  else{p.style.opacity='0';p.style.transform='';}
  ptrY=null;ptrPull=0;
});
async function doRefresh(){

}

const REV={off:0};
const REVSUS={fibre:60,fibreItem:40,protein:250,kcal:4500,steps:50000};
function rvN(x){return Math.round(x).toLocaleString();}
function rvF(x){return (Math.round(x*10)/10).toLocaleString();}
function rvSd(k){return fmtDay(k).slice(4);}
function rvDow(k){return fmtDay(k).slice(0,3);}
function rvDay(k){
  const d=state.days[k],lg=FOODBRB.logged(d),t=FOODBRB.totals(d),st=FOODBRB.stepsOf(d),fut=k>TODAY,today=k===TODAY,sus=[];

function rvUse(d,m){
  if(d.fut)return null;
  if(m==='steps'){return (d.today||d.steps==null||d.sus.includes('steps'))?null:d.steps;}
  if(!d.complete||d.sus.includes(m))return null;
  return d[m];
}

function rvBars(days,key,target,color,label){

  const mx=Math.max(target*1.25,...vals.filter(v=>v!=null).map(v=>v*1.06));
  const y=v=>pt+ph*(1-Math.min(1,v/mx));

  s+='<line class="rvtl" x1="0" x2="'+W+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+'"/><text x="'+W+'" y="'+(y(target)-3).toFixed(1)+'" text-anchor="end">target '+rvN(target)+'</text>';
  s+='<line x1="0" x2="'+W+'" y1="'+(pt+ph)+'" y2="'+(pt+ph)+'" stroke="var(--hair)"/>';
  days.forEach((d,i)=>{
    const x=i*step+(step-bw)/2,cx=x+bw/2,v=vals[i];
    if(d.k===days[0].k||rvDow(d.k)==='Mon'){s+='<line x1="'+(i*step).toFixed(1)+'" x2="'+(i*step).toFixed(1)+'" y1="'+pt+'" y2="'+(H-8)+'" stroke="var(--hair)"/><text x="'+(i*step+3).toFixed(1)+'" y="'+(H-3)+'">'+esc(rvSd(d.k))+'</text>';}

    if(d.fut){s+='<circle cx="'+cx.toFixed(1)+'" cy="'+(pt+ph-1.5)+'" r="1.2" fill="var(--hair)"/>';return;}
    if(d.sus.includes(key)&&key!=='kcal'){s+='<rect x="'+x.toFixed(1)+'" y="'+pt+'" width="'+bw+'" height="'+ph+'" rx="3" fill="none" stroke="var(--amber)" stroke-dasharray="3 2"/><text x="'+cx.toFixed(1)+'" y="'+(pt-3)+'" text-anchor="middle" style="fill:var(--amber);font-weight:700">?</text>';return;}
    if(v==null){s+='<rect x="'+x.toFixed(1)+'" y="'+(pt+ph-2)+'" width="'+bw+'" height="2" rx="1" fill="var(--dim)" opacity=".5"/>';return;}
